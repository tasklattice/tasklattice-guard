name: Release image and Helm chart

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '$RELEASE_TAG' must use the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  publish-platforms:
    name: Build ${{ matrix.component }} ${{ matrix.architecture }} image
    needs:
      - quality
      - version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            dockerfile: Dockerfile.controller
            image: tali-guard-controller
            architecture: amd64
            runner: ubuntu-24.04
          - component: controller
            dockerfile: Dockerfile.controller
            image: tali-guard-controller
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: runner
            dockerfile: Dockerfile.runner
            image: tali-guard-runner
            architecture: amd64
            runner: ubuntu-24.04
          - component: runner
            dockerfile: Dockerfile.runner
            image: tali-guard-runner
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Package Helm chart for runtime image
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TASKLATTICE_GUARD_IMAGE_REPOSITORY="${registry}/tasklattice-guard" \
            bash scripts/package-runtime-chart.sh "${{ needs.version.outputs.value }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve architecture image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="${registry}/${{ matrix.image }}"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:${version}-${{ matrix.architecture }}"
            echo "${image}:sha-${short_sha}-${{ matrix.architecture }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=TALI Guard ${{ matrix.component }}
            org.opencontainers.image.description=TALI Guard ${{ matrix.component }} plane
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tali-guard-${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=tali-guard-${{ matrix.component }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    name: Publish ${{ matrix.component }} multi-architecture image
    needs:
      - version
      - publish-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            image: tali-guard-controller
          - component: runner
            image: tali-guard-runner
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          docker buildx imagetools create --tag "${image}:${version}" "${sources[@]}"
          docker buildx imagetools create --tag "${image}:sha-${short_sha}" "${sources[@]}"
          if [[ "$version" != *-* ]]; then
            docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
          fi
          docker buildx imagetools inspect "${image}:${version}"

  release:
    name: Publish GitHub Release and Helm chart
    needs:
      - version
      - publish-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TASKLATTICE_GUARD_IMAGE_REPOSITORY="${registry}/tasklattice-guard" \
            bash scripts/package-runtime-chart.sh "$version"
          cp dist/runtime-chart/tasklattice-guard.tgz \
            "dist/tasklattice-guard-${version}.tgz"
          helm push "dist/tasklattice-guard-${version}.tgz" "oci://${registry}/charts"
          (cd dist && sha256sum "tasklattice-guard-${version}.tgz" > SHA256SUMS)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart="dist/tali-guard-${version}.tgz"
          assets=("$chart" "dist/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "TALI Guard ${version}"
          fi
