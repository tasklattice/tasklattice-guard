name: Release image and Helm chart

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify main CI for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful main CI run for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          deadline=$((SECONDS + 5400))
          no_run_since=""
          while (( SECONDS < deadline )); do
            if ! runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
                --commit "$sha" --limit 20 --json status,conclusion,event,headBranch); then
              echo "Could not query CI runs; retrying in 20s." >&2
              sleep 20
              continue
            fi
            main_runs=$(jq -c '[.[] | select(.event == "push" and .headBranch == "main")]' <<<"$runs")
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$main_runs" >/dev/null; then
              echo "Main CI already succeeded for $sha."
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<<"$main_runs" >/dev/null; then
              echo "Waiting for the main CI run on $sha to finish."
              no_run_since=""
              sleep 20
              continue
            fi
            if jq -e 'length > 0' <<<"$main_runs" >/dev/null; then
              echo "Main CI for $sha completed without success:" >&2
              jq -r '.[] | "\(.status) \(.conclusion // "-")"' <<<"$main_runs" >&2
              exit 1
            fi
            # A tag may be pushed before Actions registers the main-branch run.
            if [[ -z "$no_run_since" ]]; then no_run_since=$SECONDS; fi
            if (( SECONDS - no_run_since >= 300 )); then
              echo "No main CI run exists for $sha." >&2
              echo "Push the commit to main and let CI pass before creating the release tag." >&2
              exit 1
            fi
            echo "No main CI run registered yet; waiting."
            sleep 15
          done
          echo "Timed out waiting for main CI on $sha." >&2
          exit 1

  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '$RELEASE_TAG' must use the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  runner-model-bundle:
    name: Resolve published Runner Model Bundle
    needs: [verify, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      reference: ${{ steps.bundle.outputs.reference }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve bundle digest from GHCR
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          tag=$(bash scripts/runner-model-bundle-ref.sh)
          image=${tag%:*}
          deadline=$((SECONDS + 480))
          while (( SECONDS < deadline )); do
            if digest=$(timeout 30s docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}') \
                && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "reference=${image}@${digest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for Runner Model Bundle CI to publish $tag."
            sleep 20
          done
          echo "::error::Missing bundle $tag. Run the Runner Model Bundle workflow for the tagged source, then rerun Release."
          exit 1

  publish-platforms:
    name: Build ${{ matrix.component }} ${{ matrix.architecture }} image
    needs:
      - verify
      - version
      - runner-model-bundle
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            dockerfile: Dockerfile.controller
            image: tali-guard-controller
            architecture: amd64
            runner: ubuntu-24.04
          - component: controller
            dockerfile: Dockerfile.controller
            image: tali-guard-controller
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: runner
            dockerfile: Dockerfile.runner
            image: tali-guard-runner
            architecture: amd64
            runner: ubuntu-24.04
          - component: runner
            dockerfile: Dockerfile.runner
            image: tali-guard-runner
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Capture Git build identity
        id: git-build
        run: echo "info=$(node scripts/git-build-info.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for contract generation
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: controller/package-lock.json

      - name: Generate bundled Default artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check uv
          uv sync --extra test --extra formal --frozen
          npm ci --prefix controller --no-audit --no-fund
          npm run generate

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Package Helm chart for runtime image
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TALI_GUARD_CONTROLLER_IMAGE_REPOSITORY="${registry}/tali-guard-controller" \
            TALI_GUARD_RUNNER_IMAGE_REPOSITORY="${registry}/tali-guard-runner" \
            bash scripts/package-runtime-chart.sh "${{ needs.version.outputs.value }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve architecture image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="${registry}/${{ matrix.image }}"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:${version}-${{ matrix.architecture }}"
            echo "${image}:sha-${short_sha}-${{ matrix.architecture }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image
        id: build-image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.component == 'runner' && format('runner_model_bundle=docker-image://{0}', needs.runner-model-bundle.outputs.reference) || '' }}
          build-args: |
            TALI_BUILD_INFO=${{ steps.git-build.outputs.info }}
          target: runtime
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=TALI Guard ${{ matrix.component }}
            org.opencontainers.image.description=TALI Guard ${{ matrix.component }} plane
            org.opencontainers.image.version=${{ needs.version.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=tali-guard-${{ matrix.component }}-${{ matrix.architecture }}
            ${{ matrix.component == 'runner' && format('type=registry,ref={0}:build-cache-{1}', steps.image.outputs.name, matrix.architecture) || '' }}
          cache-to: ${{ matrix.component == 'runner' && format('type=registry,mode=max,ref={0}:build-cache-{1}', steps.image.outputs.name, matrix.architecture) || format('type=gha,mode=max,scope=tali-guard-{0}-{1}', matrix.component, matrix.architecture) }}
          provenance: mode=max
          sbom: true

      - name: Verify built-in Laya in the published Runner
        if: matrix.component == 'runner'
        shell: bash
        env:
          RUNNER_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$RUNNER_IMAGE"
          bash scripts/test-runner-laya.sh "$RUNNER_IMAGE"

  publish-manifest:
    name: Publish ${{ matrix.component }} multi-architecture image
    needs:
      - version
      - publish-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            image: tali-guard-controller
          - component: runner
            image: tali-guard-runner
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::12}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          docker buildx imagetools create --tag "${image}:${version}" "${sources[@]}"
          docker buildx imagetools create --tag "${image}:sha-${short_sha}" "${sources[@]}"
          docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
          docker buildx imagetools inspect "${image}:${version}"

  release:
    name: Publish GitHub Release and Helm chart
    needs:
      - version
      - publish-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TALI_GUARD_CONTROLLER_IMAGE_REPOSITORY="${registry}/tali-guard-controller" \
            TALI_GUARD_RUNNER_IMAGE_REPOSITORY="${registry}/tali-guard-runner" \
            bash scripts/package-runtime-chart.sh "$version"
          cp dist/runtime-chart/tali-guard.tgz \
            "dist/tali-guard-${version}.tgz"
          helm push "dist/tali-guard-${version}.tgz" "oci://${registry}/charts"
          (cd dist && sha256sum "tali-guard-${version}.tgz" > SHA256SUMS)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart="dist/tali-guard-${version}.tgz"
          assets=("$chart" "dist/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "TALI Guard ${version}"
          fi
