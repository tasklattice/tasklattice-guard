name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.0.0

      - name: Lint standalone chart
        run: helm lint charts/tasklattice-guard --strict

      - name: Render default TALI deployment
        run: >-
          helm template tasklattice-guard charts/tasklattice-guard
          --namespace tali
          --set-string auth.apiKey=ci-test-key
          > /tmp/tasklattice-guard.yaml

      - name: Package chart for runtime image
        run: bash scripts/package-runtime-chart.sh 0.0.0-ci

      - name: Verify packaged chart
        shell: bash
        run: |
          set -euo pipefail
          chart="dist/runtime-chart/tasklattice-guard.tgz"
          metadata="$(helm show chart "$chart")"
          grep -Fx "version: 0.0.0-ci" <<<"$metadata"
          grep -Fx "appVersion: 0.0.0-ci" <<<"$metadata"
          helm template tasklattice-guard "$chart" \
            --namespace tali \
            --set-string auth.apiKey=ci-test-key \
            > /tmp/tasklattice-guard-packaged.yaml

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Test, typecheck, and build UI
        working-directory: web
        run: npm test && npm run typecheck && npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -q
