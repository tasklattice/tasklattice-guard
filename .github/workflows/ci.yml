name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.0.0

      - name: Lint standalone chart
        run: make helm-lint

      - name: Render development deployment
        run: make helm-template > /tmp/tali-guard.yaml

      - name: Package chart for runtime image
        run: bash scripts/package-runtime-chart.sh 0.0.0-ci

      - name: Verify packaged chart
        shell: bash
        run: |
          set -euo pipefail
          chart="dist/runtime-chart/tasklattice-guard.tgz"
          metadata="$(helm show chart "$chart")"
          grep -Fx "version: 0.0.0-ci" <<<"$metadata"
          grep -Fx "appVersion: 0.0.0-ci" <<<"$metadata"
          helm template tasklattice-guard "$chart" \
            --namespace tali \
            --set-string auth.apiKey=ci-test-key \
            > /tmp/tasklattice-guard-packaged.yaml

      - name: Verify packaged chart
        shell: bash
        run: |
          set -euo pipefail
          chart="dist/runtime-chart/tali-guard.tgz"
          metadata="$(helm show chart "$chart")"
          grep -Fx "name: tali-guard" <<<"$metadata"
          grep -Fx "version: 0.0.0-ci" <<<"$metadata"
          grep -Fx "appVersion: 0.0.0-ci" <<<"$metadata"
          helm template tali-guard "$chart" \
            --namespace tali \
            --set database.url=postgresql://guard:guard@postgres:5432/guard \
            --set security.artifactSigning.existingSecret=guard-artifact-signing \
            --set security.controlTls.existingSecret=guard-control-tls \
            --set security.bootstrapAdmin.existingSecret=guard-bootstrap-admin \
            --set runner.callContextRedisUrl=redis://redis:6379/0 \
            > /tmp/tali-guard-packaged.yaml

  controller:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: controller/package-lock.json

      - name: Install Controller dependencies
        working-directory: controller
        run: npm ci --no-audit --no-fund

      - name: Test, typecheck, and build Controller
        working-directory: controller
        run: npm test && npm run typecheck && npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -q
