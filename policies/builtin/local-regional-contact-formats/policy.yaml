# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: local-regional-contact-formats
  name: Regional phone & address formats
  description: Recognize configured Brazilian, French, UAE, Singapore and Canadian phone/address formats,
    plus street addresses. This extends Email & phone identifiers; it is not worldwide address recognition.
  source: built_in
  version: 2.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: collection
    value: focused-protection
    label: Focused protection
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
rules:
- rules/pattern-sg_phone.yaml
- rules/pattern-uae_phone.yaml
- rules/pattern-fr_phone.yaml
- rules/pattern-br_phone_mobile.yaml
- rules/pattern-br_phone_landline.yaml
- rules/pattern-br_cep.yaml
- rules/pattern-fr_postal_code.yaml
- rules/pattern-street_address.yaml
- rules/pattern-sg_postal_code.yaml
- rules/pattern-ca_postal_code.yaml
tests:
- tests/acceptance.yaml
- tests/regression.yaml
