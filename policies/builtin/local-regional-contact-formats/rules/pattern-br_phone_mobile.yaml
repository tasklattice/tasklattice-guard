# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/br_phone_mobile
name: Brazilian Mobile Phone Number
description: Detects Brazilian mobile phone numbers (9 prefix for mobile)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?:\+\d{1,3}\s?)?(?:\(?\d{2}\)?\s?)?9\d{4}-?\d{4}
on_match:
  action: redact
  replacement: '[br_phone_mobile_REDACTED]'
runtime_adapter:
  binding_id: local-regional-contact-formats
  implementation_rule_id: br_phone_mobile
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
