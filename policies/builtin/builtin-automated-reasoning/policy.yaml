# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: builtin-automated-reasoning
  name: Automated Reasoning
  description: Validates model output against a pinned formal reasoning policy.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: answer_reliability
    label: Answer reliability
    source: declared
  - namespace: guardrail_category
    value: hallucinations_fact_checking
    label: Hallucinations & Fact-Checking
    source: declared
parameters: []
rules:
- rules/model-automated-reasoning.yaml
tests:
- tests/acceptance.yaml
