# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/visa
name: Credit Card (Visa)
description: Detects Visa credit card numbers
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b4\d{3}[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b
on_match:
  action: transform
  replacement: '[visa_REDACTED]'
runtime_adapter:
  binding_id: pattern-matching
  implementation_rule_id: visa
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
risk_level: high
