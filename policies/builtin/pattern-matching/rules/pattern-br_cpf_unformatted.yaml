# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/br_cpf_unformatted
name: CPF - Brazilian Personal Tax ID (Unformatted)
description: Detects Brazilian CPF numbers without formatting (11 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{11}\b
on_match:
  action: redact
  replacement: '[br_cpf_unformatted_REDACTED]'
runtime_adapter:
  binding_id: pattern-matching
  implementation_rule_id: br_cpf_unformatted
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
risk_level: low
