# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/street_address
name: Street Address
description: Detects street addresses (number + street name + street type)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{1,6}\s+[A-Za-z0-9][A-Za-z0-9\s.'-]*\s+(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Drive|Dr|Lane|Ln|Way|Court|Ct|Place|Pl|Circle|Cir)\b
on_match:
  action: redact
  replacement: '[street_address_REDACTED]'
runtime_adapter:
  binding_id: pattern-matching
  implementation_rule_id: street_address
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
