# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/passport_japan
name: Passport (Japan)
description: Japanese passport numbers (2 letters + 7 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[A-Z]{2}[0-9]{7}\b
on_match:
  action: redact
  replacement: '[passport_japan_REDACTED]'
runtime_adapter:
  binding_id: pattern-matching
  implementation_rule_id: passport_japan
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
