# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/au_medicare
name: Medicare Number (Australia)
description: Detects Australian Medicare numbers (formatted XXXX XXXXX X or 11 consecutive digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:\d{4}\s?\d{5}\s?\d{1}|\d{11})\b
on_match:
  action: redact
  replacement: '[au_medicare_REDACTED]'
runtime_adapter:
  binding_id: pattern-matching
  implementation_rule_id: au_medicare
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-HEALTH
risk_level: high
