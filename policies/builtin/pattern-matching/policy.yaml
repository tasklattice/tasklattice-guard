# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: pattern-matching
  name: Pattern Matching
  description: Detects and masks 82 reviewed identity, credential, financial, safety, and regional data
    patterns locally.
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: collection
    value: local-content-filter
    label: Local Content Filter
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: implementation
    value: regex
    label: Regex
    source: derived
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: rail
    value: output
    label: Output rail
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
