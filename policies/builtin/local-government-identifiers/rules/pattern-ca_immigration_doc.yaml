id: pattern/ca_immigration_doc
name: Immigration Document (Canada IRCC)
description: Detects Canadian immigration document numbers including UCI (10-digit),
  work/study permits, and IMM document references
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:\d{4}[\-\s]\d{4}[\-\s]\d{2}|[TUFW]\d{8,10}|IMM[\-\s]?\d{4,5})\b
    context_expression: \b(?:unique\s*client\s*identifier|study\s*permit\s*number|work\s*permit\s*number|study\s*permit|work\s*permit|UCI|immigration|IRCC|permanent\s*resident|PR\s*card|permis\s*d'études|permis\s*de\s*travail|landed\s*immigrant|temporary\s*resident)\b
    context_max_gap_words: 1
on_match:
  action: redact
  replacement: '[ca_immigration_doc_REDACTED]'
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: ca_immigration_doc
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
