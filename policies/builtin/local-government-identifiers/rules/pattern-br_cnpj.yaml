# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/br_cnpj
name: CNPJ - Brazilian Company Tax ID
description: Detects Brazilian CNPJ company registration numbers (XX.XXX.XXX/XXXX-XX format)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}
on_match:
  action: redact
  replacement: '[br_cnpj_REDACTED]'
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: br_cnpj
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
risk_level: low
