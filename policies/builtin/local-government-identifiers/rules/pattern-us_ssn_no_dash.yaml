# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/us_ssn_no_dash
name: SSN (No Dashes)
description: Detects US SSN without dashes (XXXXXXXXX format)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?!000|666|9\d{2})\d{3}(?!00)\d{2}(?!0000)\d{4}\b
on_match:
  action: redact
  replacement: '[us_ssn_no_dash_REDACTED]'
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: us_ssn_no_dash
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
