schema_version: 1
kind: Policy
metadata:
  id: local-government-identifiers
  name: Government, tax & health identifiers
  description: Redact reviewed government, tax, health and institutional identifier formats, including spaced
    Australian tax and Medicare numbers. Broad numeric formats can overlap; this is format screening, not identity
    verification.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: framework
    value: gdpr
    label: GDPR
    source: declared
  - namespace: framework
    value: pdpa
    label: Singapore PDPA
    source: declared
  - namespace: framework
    value: pipl-cn
    label: PIPL (China)
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  - namespace: jurisdiction
    value: cn
    label: China mainland
    source: declared
  - namespace: jurisdiction
    value: eu
    label: European Union
    source: declared
  - namespace: jurisdiction
    value: sg
    label: Singapore
    source: declared
  - namespace: jurisdiction
    value: uae
    label: United Arab Emirates
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
