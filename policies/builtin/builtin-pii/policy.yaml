# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 1
kind: Policy
metadata:
  id: builtin-pii
  name: PII Protection
  description: Redacts exact personal identifiers locally, then reviews every request
    and response for remaining personal information with the independently assigned
    semantic PII model.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
parameters: []
rules:
- rules/model-pii.yaml
tests:
- tests/acceptance.yaml
