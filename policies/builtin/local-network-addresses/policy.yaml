schema_version: 1
kind: Policy
metadata:
  id: local-network-addresses
  name: Network addresses & URLs
  description: Redact IPv4, IPv6 and URL formats, including public addresses. This
    is a disclosure filter, not an SSRF defense or a network access policy.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules: []
tests:
- tests/acceptance.yaml
rule_refs:
- id: pattern/ipv4
  version: 1.0.0
- id: pattern/ipv6
  version: 1.0.0
- id: pattern/url
  version: 1.0.0
