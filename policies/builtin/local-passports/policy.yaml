schema_version: 1
kind: Policy
metadata:
  id: local-passports
  name: Passport identifiers
  description: Redact reviewed international passport formats and context-labelled
    passport identifiers. Format matching does not establish document validity or
    issuing jurisdiction.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: framework
    value: gdpr
    label: GDPR
    source: declared
  - namespace: framework
    value: pdpa
    label: Singapore PDPA
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  - namespace: jurisdiction
    value: eu
    label: European Union
    source: declared
  - namespace: jurisdiction
    value: sg
    label: Singapore
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules: []
tests:
- tests/acceptance.yaml
rule_refs:
