# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: international-pii-identifiers/passport_uk
name: Passport (UK)
description: UK passport numbers (9 digits)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[0-9]{9}\b
on_match:
  action: redact
  replacement: '[passport_uk_REDACTED]'
runtime_adapter:
  binding_id: international-pii-identifiers
  implementation_rule_id: passport_uk
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
