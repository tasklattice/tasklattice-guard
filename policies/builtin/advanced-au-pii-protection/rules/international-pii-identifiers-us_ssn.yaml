# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: international-pii-identifiers/us_ssn
name: SSN (Social Security Number)
description: Detects US Social Security Numbers (XXX-XX-XXXX format)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{3}-\d{2}-\d{4}\b
on_match:
  action: transform
  replacement: '[us_ssn_REDACTED]'
runtime_adapter:
  binding_id: international-pii-identifiers
  implementation_rule_id: us_ssn
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
