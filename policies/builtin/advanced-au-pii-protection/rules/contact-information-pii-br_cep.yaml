# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: contact-information-pii/br_cep
name: CEP - Brazilian Zip / Postal Code
description: Detects Brazilian CEP postal codes (XXXXX-XXX or XXXXXXXX format)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{5}-?\d{3}\b
on_match:
  action: transform
  replacement: '[br_cep_REDACTED]'
runtime_adapter:
  binding_id: contact-information-pii
  implementation_rule_id: br_cep
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
