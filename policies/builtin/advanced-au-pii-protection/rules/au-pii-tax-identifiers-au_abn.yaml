# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: au-pii-tax-identifiers/au_abn
name: ABN (Australian Business Number)
description: 'Detects Australian Business Numbers (11 digits, optional spaces: XX XXX XXX XXX)'
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{2}\s?\d{3}\s?\d{3}\s?\d{3}\b
on_match:
  action: transform
  replacement: '[au_abn_REDACTED]'
runtime_adapter:
  binding_id: au-pii-tax-identifiers
  implementation_rule_id: au_abn
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
risk_level: low
