# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: international-pii-identifiers/passport_canada
name: Passport (Canada)
description: 'Canadian passport numbers (old: 2 letters + 6 digits; new: 1 letter + 6 digits + 2 letters)'
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b([A-Z]{2}[0-9]{6}|[A-Z][0-9]{6}[A-Z]{2})\b
on_match:
  action: transform
  replacement: '[passport_canada_REDACTED]'
runtime_adapter:
  binding_id: international-pii-identifiers
  implementation_rule_id: passport_canada
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
