id: pattern/br_phone_mobile
name: Brazilian Mobile Phone Number
description: Detects Brazilian mobile phone numbers (9 prefix for mobile)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<!\w)(?:\+\d{1,3}\s?)?(?:\(?\d{2}\)?\s?)?9\d{4}-?\d{4}(?!\w)
on_match:
  action: transform
  replacement: '[br_phone_mobile_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/br_phone_mobile
