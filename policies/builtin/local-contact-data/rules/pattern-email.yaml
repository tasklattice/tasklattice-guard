# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/email
name: Email Address
description: Detects email addresses
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b
on_match:
  action: transform
  replacement: '[email_REDACTED]'
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: email
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
