id: pattern/br_phone_landline
name: Brazilian Phone Number (Landline)
description: Detects Brazilian landline phone numbers with optional area code
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<!\w)(?:\(?\d{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}(?!\w)
on_match:
  action: transform
  replacement: '[br_phone_landline_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/br_phone_landline
