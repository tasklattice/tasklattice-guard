# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/us_phone
name: Phone Number (US)
description: Detects US phone numbers in various formats
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:\+?1[\s.-]?)?\(?([0-9]{3})\)?[\s.-]?([0-9]{3})[\s.-]?([0-9]{4})\b
on_match:
  action: redact
  replacement: '[us_phone_REDACTED]'
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: us_phone
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
