id: pattern/contact_list_person
name: Name in an identifier list
description: 'Opt-in format heuristic: redact short capitalized scalar entries only in the same contiguous list
  as both a grouped international phone and a nine-digit identifier. Accept the existing typed SSN redaction marker
  when an earlier Transform has already removed the identifier. Ordinary prose and lists without both anchors are
  excluded; ambiguous mixed lists still require scope review.'
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: "(?m)^[ \\t]*[-*][ \\t]+[\"\\x27]?(?P<value>(?-i:[A-Z\xC0-\xD6\xD8-\xDE][^\\W\\d_]{1,39}(?:[-'\u2019\
      ][A-Z\xC0-\xD6\xD8-\xDE]?[^\\W\\d_]{1,39})*)(?:[ \\t]+(?-i:[A-Z\xC0-\xD6\xD8-\xDE][^\\W\\d_]{1,39}(?:[-'\u2019\
      ][A-Z\xC0-\xD6\xD8-\xDE]?[^\\W\\d_]{1,39})*)){0,4})[\"\\x27]?[ \\t]*$"
    detector_options:
      capture_group: value
      sibling_patterns:
      - \+[1-9][0-9]{0,2}(?:[ .\-]+\(?[0-9]{1,4}\)?){2,5}
      - (?:[0-9]{9}|[0-9]{3}-[0-9]{2}-[0-9]{4}|\[us_ssn(?:_no_dash)?_REDACTED\])
on_match:
  action: transform
  replacement: '[contact_list_person_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/contact_list_person
