id: pattern/truncated_address
name: Street in a truncated address record
description: Recover a street value only at the start of a truncated quoted record, with both city and postal fields
  in the same object. Do not infer standalone street names or redact unrelated document titles.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \A[ \t]*(?:[a-z_][a-z_0-9]{0,23}["']\s*:\s*["']|["'])(?P<value>(?-i:[A-ZÀ-ÖØ-Þ])[^"'\r\n{}<>]{0,100}\b(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Drive|Dr|Lane|Ln|Way|Court|Ct|Place|Pl|Circle|Cir))["'](?=[^{}]{0,512}["']city["']\s*:)(?=[^{}]{0,512}["'](?:postcode|postal_code|zip_code)["']\s*:)
    detector_options:
      capture_group: value
on_match:
  action: transform
  replacement: '[truncated_address_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/truncated_address
