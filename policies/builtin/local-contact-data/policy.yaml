schema_version: 1
kind: Policy
metadata:
  id: local-contact-data
  name: Contact information
  description: Redact reviewed contact formats and opt-in person contexts. Structured fields, honorifics, identifier-list
    context and truncated address records preserve source syntax. This is bounded local format screening, not worldwide
    entity recognition; generic dates and times remain outside this profile.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: framework
    value: gdpr
    label: GDPR
    source: declared
  - namespace: framework
    value: pdpa
    label: Singapore PDPA
    source: declared
  - namespace: framework
    value: pipl-cn
    label: PIPL (China)
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  - namespace: jurisdiction
    value: cn
    label: China mainland
    source: declared
  - namespace: jurisdiction
    value: eu
    label: European Union
    source: declared
  - namespace: jurisdiction
    value: sg
    label: Singapore
    source: declared
  - namespace: jurisdiction
    value: uae
    label: United Arab Emirates
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules:
- rules/pattern--titled_person.yaml
- rules/pattern--contact_list_person.yaml
- rules/pattern--truncated_address.yaml
- rules/pattern--structured_username.yaml
- rules/pattern--structured_address.yaml
- rules/pattern--labelled_person.yaml
- rules/pattern--international_phone.yaml
- rules/pattern--sg_phone.yaml
- rules/pattern--uae_phone.yaml
- rules/pattern--fr_phone.yaml
- rules/pattern--br_phone_mobile.yaml
- rules/pattern--br_phone_landline.yaml
- rules/pattern--br_cep.yaml
- rules/pattern--fr_postal_code.yaml
- rules/pattern--street_address.yaml
- rules/pattern--sg_postal_code.yaml
- rules/pattern--ca_postal_code.yaml
- rules/pattern--email.yaml
- rules/pattern--us_phone.yaml
- rules/cn-personal-information--mainland-mobile.yaml
- rules/gdpr-eu-contact-information--fr_postal_code.yaml
- rules/sg-pdpa-contact-information--sg_postal_code.yaml
- rules/uae-data-protection-pii--uae_po_box.yaml
tests:
- tests/acceptance.yaml
