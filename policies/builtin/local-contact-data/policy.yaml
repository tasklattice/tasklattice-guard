# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: local-contact-data
  name: Email & phone identifiers
  description: Redact email addresses and North American phone formats. Add jurisdiction-specific Policies
    for other phone formats.
  source: built_in
  version: 2.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: collection
    value: focused-protection
    label: Focused protection
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
rules:
- rules/pattern-email.yaml
- rules/pattern-us_phone.yaml
tests:
- tests/acceptance.yaml
- tests/regression.yaml
