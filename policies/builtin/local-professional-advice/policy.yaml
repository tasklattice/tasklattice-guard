schema_version: 1
kind: Policy
metadata:
  id: local-professional-advice
  name: Professional Advice Restrictions
  description: Local financial, medical and legal advice boundaries. Select the Rules appropriate to the application.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: business_rules
    label: Business Rules
    source: declared
  - namespace: guardrail_category
    value: topic_control
    label: Topic Control
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules:
- rules/claims-medical-advice-filter--claims_medical_advice.yaml
- rules/category--denied_financial_advice.yaml
- rules/category--denied_legal_advice.yaml
- rules/category--denied_medical_advice.yaml
tests:
- tests/acceptance.yaml
