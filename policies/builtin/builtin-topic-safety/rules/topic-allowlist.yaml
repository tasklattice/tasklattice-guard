id: topic/allowlist
name: Allowlist
description: In strict mode, redirect tasks outside the allowed topics. In permissive
  mode, unmatched tasks may continue.
stages:
- input
detector:
  ref: model/classifier
  version: 1.0.0
  parameters:
    profile: topic-classification
on_match:
  action: block
runtime_adapter:
  binding_id: topic_control
  implementation_rule_id: topic_control
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY-OFF-TOPIC
risk_level: low
