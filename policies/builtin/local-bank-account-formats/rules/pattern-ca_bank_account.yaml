# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: pattern/ca_bank_account
name: Bank Account (Canada)
description: Detects Canadian bank account routing information (transit-institution-account format)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{5}[\-\s]\d{3}[\-\s]\d{7,12}\b
    context_expression: \b(?:bank\s*account|account\s*number|transit\s*number|institution\s*number|branch\s*number|routing\s*number|direct\s*deposit|void\s*cheque|chequing|savings\s*account|numéro\s*de\s*compte|dépôt\s*direct)\b
    context_max_gap_words: 1
on_match:
  action: transform
  replacement: '[ca_bank_account_REDACTED]'
runtime_adapter:
  binding_id: local-bank-account-formats
  implementation_rule_id: ca_bank_account
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
risk_level: high
