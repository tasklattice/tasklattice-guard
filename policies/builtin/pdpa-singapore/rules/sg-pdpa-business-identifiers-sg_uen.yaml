# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: sg-pdpa-business-identifiers/sg_uen
name: UEN (Singapore Unique Entity Number)
description: 'Detects Singapore Unique Entity Numbers for business registration (various formats: 8/9
  digits + letter, or T/R prefix)'
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:\d{8}[A-Z]|\d{9}[A-Z]|[TR]\d{2}[A-Z]{2}\d{4}[A-Z])\b
    context_expression: \b(?:UEN|company\s*registration|business\s*registration|ACRA|entity\s*number|ROC|ROS)\b
on_match:
  action: redact
  replacement: '[UEN_REDACTED]'
runtime_adapter:
  binding_id: sg-pdpa-business-identifiers
  implementation_rule_id: sg_uen
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
risk_level: low
