schema_version: 1
kind: Policy
metadata:
  id: local-sensitive-attribute-terms
  name: Sensitive attribute terms
  description: Redact configured demographic and protected-attribute words, including
    benign mentions. This optional vocabulary filter does not detect discrimination,
    infer a person's attributes or determine legality.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules: []
tests:
- tests/acceptance.yaml
- tests/attribute-contexts.yaml
documents:
- docs/attribute-contexts.md
rule_refs:
- id: pattern/gender_sexual_orientation
  version: 1.0.0
- id: pattern/race_ethnicity_national_origin
  version: 1.0.0
- id: pattern/religion
  version: 1.0.0
- id: pattern/age_discrimination
  version: 1.0.0
- id: pattern/disability
  version: 1.0.0
- id: pattern/marital_family_status
  version: 1.0.0
- id: pattern/military_status
  version: 1.0.0
- id: pattern/public_assistance
  version: 1.0.0
