# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: cn-banking/sensitive-credential-solicitation
name: Assistant solicitation of sensitive credentials
description: Rejects selected response phrases directing a customer to send a verification code, dynamic
  password, payment password, or card PIN. It cannot determine whether an authenticated channel or approved
  workflow applies.
stages:
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?!(?:请勿|请不要|不要|无需|不需要))(?:请|需要|务必).{0,8}(?:提供|告知|发送|回复).{0,12}(?:短信验证码|验证码|动态口令|支付密码|银行卡密码)|\b(?:please|you
      need to|you must)\s+(?:send|share|provide|reply with)\s+(?:your\s+)?(?:OTP|one-time password|verification
      code|card PIN)\b
on_match:
  action: reject
runtime_adapter:
  binding_id: china-banking-assistant-boundaries
  implementation_rule_id: cn-banking/sensitive-credential-solicitation
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
  - TALI-PRIVACY-FINANCIAL
risk_level: high
