- rules/competitor-name-input-blocker-dynamic-competitors-blocked-words.yaml
- rules/competitor-name-output-blocker-dynamic-competitors-blocked-words.yaml
- rules/competitor-recommendation-input-filter-dynamic-competitor-recommendation-words.yaml
- rules/competitor-recommendation-output-filter-dynamic-competitor-recommendation-words.yaml
- rules/competitor-comparison-input-filter-dynamic-competitor-comparison-words.yaml
