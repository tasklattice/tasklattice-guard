id: competitor-recommendation-input-filter/dynamic-competitor-recommendation-words
name: Competitor Recommendation Words
description: Resolved from reviewed Policy parameters.
stages:
- input
detector:
  ref: text/keyword
  version: 1.0.0
  parameters:
    detector_options:
      terms:
        parameter: competitors
        templates:
        - recommend {{item}}
        - try {{item}}
        - switch to {{item}}
on_match:
  action: reject
  replacement: null
runtime_adapter:
  binding_id: competitor-recommendation-input-filter
  implementation_rule_id: dynamic-competitor-recommendation-words
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY-OFF-TOPIC
risk_level: low
