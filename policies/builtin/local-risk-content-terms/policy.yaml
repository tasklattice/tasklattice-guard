schema_version: 1
kind: Policy
metadata:
  id: local-risk-content-terms
  name: Risk-related content terms
  description: Redact configured weapon, violence, self-harm and abuse terms. Benign reporting can also match;
    this vocabulary filter is not a semantic safety classifier.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: content_safety
    label: Content safety
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules:
- rules/pattern--explosives.yaml
- rules/pattern--weapons_firearms.yaml
- rules/pattern--weapons_other.yaml
- rules/pattern--violence_threats.yaml
- rules/pattern--terrorism.yaml
- rules/pattern--self_harm_suicide.yaml
- rules/pattern--illegal_activities.yaml
- rules/pattern--harassment_hate.yaml
tests:
- tests/acceptance.yaml
