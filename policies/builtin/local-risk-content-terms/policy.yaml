schema_version: 1
kind: Policy
metadata:
  id: local-risk-content-terms
  name: Risk-related content terms
  description: Redact configured weapon, violence, self-harm and abuse terms. Benign
    reporting can also match; this vocabulary filter is not a semantic safety classifier.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: content_safety
    label: Content safety
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules: []
tests:
- tests/acceptance.yaml
rule_refs:
- id: pattern/explosives
  version: 1.0.0
- id: pattern/weapons_firearms
  version: 1.0.0
- id: pattern/weapons_other
  version: 1.0.0
- id: pattern/violence_threats
  version: 1.0.0
- id: pattern/terrorism
  version: 1.0.0
- id: pattern/self_harm_suicide
  version: 1.0.0
- id: pattern/illegal_activities
  version: 1.0.0
- id: pattern/harassment_hate
  version: 1.0.0
