id: category/bias_gender
name: Bias Gender
description: Detects explicit gender inferiority and exclusion phrases. A gender word alone is not discrimination.
  Benign wording elsewhere cannot exempt a discriminatory sentence.
stages:
- input
- output
detector:
  ref: text/conditions
  version: 1.0.0
  parameters:
    detector_options:
      match:
        within_sentence:
          any:
          - regex: \b(?:women|woman|men|man|females?|males?|girls?|boys?)\s+(?:(?:are|is|were|was)\s+)?(?:inherently\s+|naturally\s+|intellectually\s+)?(?:inferior|less
              intelligent|unfit to lead|the weaker sex)\b
          - regex: \b(?:women|woman|men|man|females?|males?|girls?|boys?)\s+(?:should|must)\s+(?:never|not)\s+(?:vote|lead|work|study|be
              hired|hold office|own property)\b
          - regex: \b(?:never|do not|don't|refuse to)\s+(?:hire|employ|promote|educate)\s+(?:(?:any|all|qualified)\s+)?(?:women|men|females?|males?|girls?|boys?)\b
on_match:
  action: block
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-SOCIAL-HARM-DISCRIMINATION
runtime_adapter:
  binding_id: local-content-safety
  implementation_rule_id: category/bias_gender
