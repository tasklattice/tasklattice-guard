schema_version: 1
kind: Policy
metadata:
  id: local-content-safety
  name: Local Content Safety
  description: Local harmful-content, child-safety, bias and multilingual abuse checks. Individual Rules retain
    their own matching conditions and exceptions.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: content_safety
    label: Content Safety
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  - namespace: jurisdiction
    value: uae
    label: United Arab Emirates
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules:
- rules/category--denied_insults.yaml
- rules/category--harm_toxic_abuse.yaml
- rules/category--harmful_violence.yaml
- rules/category--harmful_self_harm.yaml
- rules/category--harmful_child_safety.yaml
- rules/category--harmful_illegal_weapons.yaml
- rules/category--bias_gender.yaml
- rules/category--bias_racial.yaml
- rules/category--bias_religious.yaml
- rules/category--bias_sexual_orientation.yaml
- rules/nsfw-filter-spanish--harm_toxic_abuse_es.yaml
- rules/nsfw-filter-french--harm_toxic_abuse_fr.yaml
- rules/nsfw-filter-german--harm_toxic_abuse_de.yaml
- rules/nsfw-filter-australian--harm_toxic_abuse_au.yaml
- rules/uae-cultural-sensitivity-filter--uae_cultural_sensitivity.yaml
- rules/uae-anti-discrimination-filter--uae_anti_discrimination.yaml
tests:
- tests/acceptance.yaml
- tests/word-boundaries.yaml
documents:
- docs/word-boundaries.md
