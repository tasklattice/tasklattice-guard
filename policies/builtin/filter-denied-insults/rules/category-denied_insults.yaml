          - regex: \bfocus\b.{0,10}\bsweetie\b
          - regex: \b(?:listen|pay\s+attention)\b.{0,40}\b(?:obviously|clearly)\b.{0,15}\b(?:cannot|can.t|don.t)\b
          - regex: \bdo\s+you\s+even\s+have\s+a\s+brain\b
          - regex: \bfailed\s+genius\b
          - regex: \bdesigned\s+by\s+children\b
          - regex: \b(?:did\s+anyone|nobody)\s+test\b.{0,15}\b(?:you|before|release)\b
