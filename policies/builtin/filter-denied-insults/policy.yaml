# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: filter-denied-insults
  name: Insults & Personal Attacks
  description: Detects insults, name-calling, and personal attacks directed at the chatbot, staff, or
    other people
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: content_safety
    label: Content safety
    source: declared
  - namespace: collection
    value: local-content-filter
    label: Local Content Filter
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  - namespace: implementation
    value: category
    label: Category
    source: derived
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: rail
    value: output
    label: Output rail
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
rules:
- rules/category-denied_insults.yaml
tests:
- tests/acceptance.yaml
resources:
- resources/category-denied_insults-identifiers.yaml
- resources/category-denied_insults-conditions.yaml
- resources/category-denied_insults-always_block.yaml
- resources/category-denied_insults-exceptions.yaml
- resources/category-denied_insults-phrase_patterns.yaml
