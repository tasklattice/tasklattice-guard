schema_version: 1
kind: Policy
metadata:
  id: local-credentials
  name: Passwords & API credentials
  description: Reject recognizable credential literals on input and output using local
    format and assignment rules. Includes private keys, passwords, API/auth tokens
    and connection credentials; no model is required.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules: []
tests:
- tests/acceptance.yaml
- tests/credential-contexts.yaml
- tests/token-boundaries.yaml
documents:
- docs/credential-contexts.md
- docs/token-boundaries.md
rule_refs:
- id: credentials-api-keys/aws_access_key
  version: 1.0.0
- id: credentials-api-keys/aws_secret_key
  version: 1.0.0
- id: credentials-api-keys/github_token
  version: 1.0.0
- id: credentials-api-keys/slack_token
  version: 1.0.0
- id: credentials-api-keys/generic_api_key
  version: 1.0.0
- id: credential/bearer-token
  version: 1.0.0
- id: credential/private-key-header
  version: 1.0.0
- id: credential/hex-token
  version: 1.0.0
- id: credential/password
  version: 1.0.0
- id: credential/url-password
  version: 1.0.0
- id: credential/basic-auth
  version: 1.0.0
- id: credential/jwt
  version: 1.0.0
- id: credential/labelled-hex-key
  version: 1.0.0
- id: credential/private-jwk
  version: 1.0.0
- id: credential/sql-password
  version: 1.0.0
- id: credential/command-password
  version: 1.0.0
- id: credential/nkey-seed
  version: 1.0.0
- id: credential/base64-private-key
  version: 1.0.0
