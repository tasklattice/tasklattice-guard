schema_version: 1
kind: Policy
metadata:
  id: local-credentials
  name: Passwords & API credentials
  description: Reject recognizable credential literals on input and output using local format and assignment rules.
    Includes private keys, passwords, API/auth tokens and connection credentials; no model is required.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: jurisdiction
    value: au
    label: Australia
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules:
- rules/credentials-api-keys--aws_access_key.yaml
- rules/credentials-api-keys--aws_secret_key.yaml
- rules/credentials-api-keys--github_token.yaml
- rules/credentials-api-keys--slack_token.yaml
- rules/credentials-api-keys--generic_api_key.yaml
- rules/credential--bearer-token.yaml
- rules/credential--private-key-header.yaml
- rules/credential--hex-token.yaml
- rules/credential--password.yaml
- rules/advanced-au-pii-protection--credentials-api-keys--generic_api_key.yaml
- rules/pattern--aws_secret_key.yaml
- rules/pattern--github_token.yaml
- rules/pattern--slack_token.yaml
- rules/pattern--generic_api_key.yaml
- rules/pattern--aws_access_key.yaml
- rules/credential--url-password.yaml
- rules/credential--basic-auth.yaml
- rules/credential--jwt.yaml
- rules/credential--labelled-hex-key.yaml
- rules/credential--private-jwk.yaml
- rules/credential--sql-password.yaml
- rules/credential--command-password.yaml
- rules/credential--nkey-seed.yaml
- rules/credential--base64-private-key.yaml
tests:
- tests/acceptance.yaml
- tests/credential-contexts.yaml
- tests/token-boundaries.yaml
documents:
- docs/credential-contexts.md
- docs/token-boundaries.md
