id: credential/nkey-seed
name: NATS NKEY secret seed
description: Detect 58-character, uppercase Base32 NATS NKEY seed shapes (SA/SC/SN/SO/SU/SX). Public NKEYs do not
  match. Exposure detection validates format, not CRC or whether a credential is active.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<![A-Za-z0-9_])(?-i:S[ACNOUX][A-Z2-7]{56})(?![A-Za-z0-9_])
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/nkey-seed
