id: credential/sql-password
name: SQL password literal
description: Detect SQL IDENTIFIED BY, IDENTIFIED WITH/VIA plugin BY/AS, and PostgreSQL PASSWORD literals. No query
  execution or model calls; variable references and placeholders are excluded.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w-])(?:IDENTIFIED\s+(?:(?:WITH|VIA)\s+[a-z_][a-z0-9_]{0,63}\s+)?(?:BY|AS)|(?:CREATE|ALTER)\s+(?:USER|ROLE|LOGIN)\b[^\r\n]{0,256}?\bPASSWORD)\s+(?:(?P<q>\\?"|'{1,8}|\\')(?!(?:%[svq]|\?|(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{3,}|•{3,}))(?P=q))[^\r\n"'\\]{1,512}(?P=q)|(?!["'\\$<{\-=:()&|!?+])(?!(?:password|passwd|pwd|passphrase|pass|string|str|boolean|true|false|null|none)(?=$|[\s,;}\]<>]))(?!0x[0-9a-f]+\b)(?![\w.]+\s*[\[(])(?![\w$]+\s*->)(?![A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+(?=$|[\s,;}\]<>]))(?!(?-i:[A-Z][A-Z0-9]*_[A-Z0-9_]+)(?=$|[\s,;}\]<>]))(?!(?:[a-z0-9]+_)*(?:pass|password|passwd|pwd|passphrase)(?:_[a-z0-9]+)*(?=$|[\s,;}\]<>]))[^\s,;。"'\\{}\[\]<>]{4,512}(?=$|[\s,;。}\]<>]))|(?i:(?:INSERT|UPDATE|SELECT|SET))\b[^\r\n]{0,256}?\bPASSWORD\s*\(\s*(?P<qsql>\\?"|'{1,8}|\\')(?!(?:%[svq]|\?|(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{3,}|•{3,}))(?P=qsql))[^\r\n"'\\]{1,512}(?P=qsql)\s*\)
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/sql-password
