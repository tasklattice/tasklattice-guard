# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credential/password
name: Explicit password assignment
description: Matches this reviewed text pattern, not arbitrary semantic variants.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?:\b(?:password|passwd|pwd)|密码)\s*[:=：]\s*[^\s,;。]{4,}
on_match:
  action: reject
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/password
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
