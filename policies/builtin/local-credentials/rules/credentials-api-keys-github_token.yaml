# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credentials-api-keys/github_token
name: GitHub Token
description: Detects GitHub personal access tokens
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(gh[ps]_[a-zA-Z0-9]{36})\b
on_match:
  action: block
  replacement: '[github_token_REDACTED]'
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: github_token
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
