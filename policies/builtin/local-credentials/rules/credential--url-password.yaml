id: credential/url-password
name: Credentials in connection URLs
description: Detect user:password authority components in connection URLs; exclude username-only URLs and interpolated
  credentials.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\b[a-z][a-z0-9+.-]{1,30}://[^\s:/@"'<>${}\\]{1,128}:[^\s/@"'<>${}\\]{4,256}@[^\s/"'<>]{1,253}
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/url-password
