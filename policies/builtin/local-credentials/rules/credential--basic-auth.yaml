id: credential/basic-auth
name: HTTP Basic credentials
description: 'Detect a base64 credential following an explicit Authorization: Basic header.'
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\bauthorization(?:\\?["'])?\s*[:=]\s*(?:\\?["'])?basic[ \t]+[A-Za-z0-9+/]{8,512}={0,2}(?![A-Za-z0-9+/=])
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/basic-auth
