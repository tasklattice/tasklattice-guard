id: credential/password
name: Explicit password assignment
description: Detect literal password assignments including common camel-case fields, YAML/JSON/env and := assignments.
  Exclude explicit UI-label identifiers, unquoted property references, callbacks, types, shell expansions and complete
  placeholders per candidate. Ambiguous bare literals remain a format heuristic; no file/category allowlists.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w-])(?!(?:label|title|hint|placeholder|tooltip|message|error|description)(?:[_-]|(?-i:[A-Z])))(?!(?:[a-z0-9]+[_-])*(?:label|title|hint|placeholder|tooltip|message|error|description)[_-])(?:(?:[a-z][a-z0-9]*[_-])*(?:password[0-9]*|passwd|pwd|passphrase|pass)|(?:db|database|master|user|admin|root|smtp|redis|certificate|cert|keystore|truststore)Password|密码)(?:\\?["'])?(?:\s*\])?\s*(?::=|[:=：])(?![=])\s*(?:(?P<q>\\?"|'{1,8}|\\')(?!(?:(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{3,}|•{3,}))(?P=q))[^\r\n"'\\]{4,512}(?P=q)|(?!["'\\$<{\-=:()&|!?+])(?!(?:password|passwd|pwd|passphrase|pass|string|str|boolean|true|false|null|none)(?=$|[\s,;}\]<>]))(?!0x[0-9a-f]+\b)(?![\w.]+\s*[\[(])(?![\w$]+\s*->)(?![A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+(?=$|[\s,;}\]<>]))(?!(?-i:[A-Z][A-Z0-9]*_[A-Z0-9_]+)(?=$|[\s,;}\]<>]))(?!(?:[a-z0-9]+_)*(?:pass|password|passwd|pwd|passphrase)(?:_[a-z0-9]+)*(?=$|[\s,;}\]<>]))[^\s,;。"'\\{}\[\]<>]{4,512}(?=$|[\s,;。}\]<>]))
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/password
