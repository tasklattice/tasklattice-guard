# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credentials-api-keys/aws_secret_key
name: AWS Secret Key
description: Detects AWS secret keys (40 characters)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b([A-Za-z0-9/+=]{40})\b
on_match:
  action: block
  replacement: '[aws_secret_key_REDACTED]'
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: aws_secret_key
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
