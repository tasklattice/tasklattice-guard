id: credential/private-jwk
name: Private JSON Web Key
description: Detect asymmetric JWK private member d together with kty in the same object or object fragment, in
  either order. A public-only JWK does not match.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?s)(?:["']?kty["']?\s*:\s*["'](?:RSA|EC|OKP)["'][^{}]{0,16384}?(?<![\w])["']?d["']?\s*:\s*["'][A-Za-z0-9_-]{16,8192}["']|(?<![\w])["']?d["']?\s*:\s*["'][A-Za-z0-9_-]{16,8192}["'][^{}]{0,16384}?["']?kty["']?\s*:\s*["'](?:RSA|EC|OKP)["'])
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/private-jwk
