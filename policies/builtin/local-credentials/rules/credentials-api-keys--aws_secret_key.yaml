id: credentials-api-keys/aws_secret_key
name: AWS Secret Key
description: Detect 40-character AWS secret values only with a secret-key assignment label; arbitrary hashes and
  URL path components are not AWS credentials.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w])(?:aws[_-]?)?secret[_-]?(?:access[_-]?)?key(?:\\?["'])?(?:\s*\])?\s*[:=：]\s*["']?[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])
on_match:
  action: block
  replacement: '[aws_secret_key_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credentials-api-keys/aws_secret_key
