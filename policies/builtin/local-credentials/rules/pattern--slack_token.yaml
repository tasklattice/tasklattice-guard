id: pattern/slack_token
name: Slack Token
description: Detect xox-prefixed Slack tokens and rotating xoxe refresh-token formats.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:xox[pboa]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,32}|xoxe-[0-9]+-[A-Za-z0-9-]{20,})\b
on_match:
  action: transform
  replacement: '[slack_token_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: pattern/slack_token
