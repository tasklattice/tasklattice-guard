id: credential/bearer-token
name: Bearer Token
description: Detect Bearer credentials with the token alphabet including base64 padding; the minimum length remains
  24.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\bbearer[ \t]+[A-Za-z0-9_~+/.=-]{24,}(?![A-Za-z0-9_~+/.=-])
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/bearer-token
