id: credential/private-key-header
name: Private Key Header
description: Detect PEM PKCS#8, encrypted PKCS#8, algorithm-specific/OpenSSH private keys and PGP private key blocks.
  Public keys and certificates do not match.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: '-----BEGIN (?:(?:RSA|EC|DSA|OPENSSH|ENCRYPTED) )?PRIVATE KEY-----|-----BEGIN PGP PRIVATE KEY BLOCK-----'
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/private-key-header
