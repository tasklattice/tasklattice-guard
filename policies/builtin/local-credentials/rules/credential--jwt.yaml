id: credential/jwt
name: JSON Web Token
description: Detect a signed JWT-shaped value with a JSON header, payload and signature; no token is authenticated
  or sent to an issuer.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \beyJ[A-Za-z0-9_-]{6,2048}\.[A-Za-z0-9_-]{6,8192}\.[A-Za-z0-9_-]{16,2048}(?![A-Za-z0-9_.-])
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credential/jwt
