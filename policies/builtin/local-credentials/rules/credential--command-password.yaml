id: credential/command-password
name: Command-line password literal
description: 'Detect explicit --password/-Password arguments, OpenSSL pass: sources and attached MySQL -p literals.
  Environment/file sources, interactive flags and shell variables do not match; other commands do not interpret
  generic -p as a password.'
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w-])(?:--?(?:[a-z][a-z0-9]*-)*(?:(?:certificate|cert|keystore)?password|passwd|passphrase|pwd)(?:=|\s+)(?:(?P<q>\\?"|'{1,8}|\\')(?!(?:(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{3,}|•{3,}))(?P=q))[^\r\n"'\\]{4,512}(?P=q)|(?!["'\\$<{\-=:()&|!?+])(?!(?:password|passwd|pwd|passphrase|pass|string|str|boolean|true|false|null|none)(?=$|[\s,;}\]<>]))(?!0x[0-9a-f]+\b)(?![\w.]+\s*[\[(])(?![\w$]+\s*->)(?![A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+(?=$|[\s,;}\]<>]))(?!(?-i:[A-Z][A-Z0-9]*_[A-Z0-9_]+)(?=$|[\s,;}\]<>]))(?!(?:[a-z0-9]+_)*(?:pass|password|passwd|pwd|passphrase)(?:_[a-z0-9]+)*(?=$|[\s,;}\]<>]))[^\s,;。"'\\{}\[\]<>]{4,512}(?=$|[\s,;。}\]<>]))|-(?:passin|passout)\s+pass:(?:(?P<q2>\\?"|'{1,8}|\\')(?!(?:(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{3,}|•{3,}))(?P=q2))[^\r\n"'\\]{4,512}(?P=q2)|(?!["'\\$<{\-=:()&|!?+])(?!(?:password|passwd|pwd|passphrase|pass|string|str|boolean|true|false|null|none)(?=$|[\s,;}\]<>]))(?!0x[0-9a-f]+\b)(?![\w.]+\s*[\[(])(?![\w$]+\s*->)(?![A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+(?=$|[\s,;}\]<>]))(?!(?-i:[A-Z][A-Z0-9]*_[A-Z0-9_]+)(?=$|[\s,;}\]<>]))(?!(?:[a-z0-9]+_)*(?:pass|password|passwd|pwd|passphrase)(?:_[a-z0-9]+)*(?=$|[\s,;}\]<>]))[^\s,;。"'\\{}\[\]<>]{4,512}(?=$|[\s,;。}\]<>]))|(?:mysql|mysqldump|mariadb)\b[^\r\n]{0,256}?\s-p(?:(?P<q3>\\?"|'{1,8}|\\')(?!(?:(?:\$\{[^{}\r\n]+\}|\{\{[^{}\r\n]+\}\}|<[a-z][a-z0-9_-]*>|\*{3,}|•{3,}))(?P=q3))[^\r\n"'\\]{4,512}(?P=q3)|(?!["'\\$<{\-=:()&|!?+])(?!(?:password|passwd|pwd|passphrase|pass|string|str|boolean|true|false|null|none)(?=$|[\s,;}\]<>]))(?!0x[0-9a-f]+\b)(?![\w.]+\s*[\[(])(?![\w$]+\s*->)(?![A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+(?=$|[\s,;}\]<>]))(?!(?-i:[A-Z][A-Z0-9]*_[A-Z0-9_]+)(?=$|[\s,;}\]<>]))(?!(?:[a-z0-9]+_)*(?:pass|password|passwd|pwd|passphrase)(?:_[a-z0-9]+)*(?=$|[\s,;}\]<>]))[^\s,;。"'\\{}\[\]<>]{4,512}(?=$|[\s,;。}\]<>])))|(?i:--?(?:[a-z][a-z0-9]*-)*(?:password|passwd|passphrase|pwd))[\"']\s*,\s*(?P<qa>\\?"|'{1,8}|\\')(?!(?:(?:\$\{[^{}\