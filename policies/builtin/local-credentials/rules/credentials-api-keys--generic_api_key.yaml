id: credentials-api-keys/generic_api_key
name: API Key (Generic)
description: Detect labelled API keys, client/shared secrets and access/auth tokens in assignments, JSON and query
  strings. Require an explicit credential field and at least 16 value characters.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?<![\w])(?:api[_-]?(?:key|token)|access[_-]?token|secret[_-]?key|shared[_-]?secret|client[_-]?secret|(?:_?oauth[_-](?:request[_-])?)?token(?:[_-]secret)?|bearer[_-]token|secret)(?:(?:\\?["'])?(?:\s*\])?\s*[:=：]\s*|["']?[
      \t]+)["']?(?![A-Za-z_][\w.]*\s*[\[(])[A-Za-z0-9_./+%|=-]{16,512}(?![A-Za-z0-9_./+%|=-])
on_match:
  action: block
  replacement: '[generic_api_key_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
runtime_adapter:
  binding_id: local-credentials
  implementation_rule_id: credentials-api-keys/generic_api_key
