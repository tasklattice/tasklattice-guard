schema_version: 2
kind: Policy
metadata:
  id: configured-phrase-filter
  name: Phrase filters
  description: Block or replace your own phrases in their configured order. Runs locally
    on input and output, with no detection model. Literal matching is case-insensitive;
    it is not semantic content safety.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: content_filters
    label: Words & content filters
    source: declared
  - namespace: collection
    value: configurable-protection
    label: Configurable protection
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters:
- name: phrase_entries
  label: Phrases and actions
  kind: phrase_entries
  required: true
  placeholder: ''
  description: Entries run in order within this Policy. Replacement text continues
    to the next entry; a block ends execution.
rules:
- rules/configured-phrases.yaml
tests:
- tests/acceptance.yaml
testing:
  parameters:
    phrase_entries: '[{"id": "secret", "phrase": "INTERNAL_SECRET", "action": "reject"}]'
