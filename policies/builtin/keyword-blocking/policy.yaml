# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: keyword-blocking
  name: Keyword Blocking
  description: Blocks or masks a reviewed, line-separated list of words and phrases without an external
    model call.
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: content_filters
    label: Words & content filters
    source: declared
  - namespace: collection
    value: local-content-filter
    label: Local Content Filter
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  - namespace: implementation
    value: keyword
    label: Keyword
    source: derived
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: rail
    value: output
    label: Output rail
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters:
- name: blocked_words
  label: Blocked words and phrases
  kind: textarea
  required: true
  placeholder: One word or phrase per line
  description: The reviewed local deny-list for this Guardrail binding.
rules:
- rules/keyword-blocked-words.yaml
tests:
- tests/acceptance.yaml
testing:
  parameters:
    blocked_words: INTERNAL_SECRET
