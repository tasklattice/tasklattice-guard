# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: filter-prompt-injection-sql
  name: Prompt Injection Sql
  description: Detects SQL injection attempts embedded in prompts
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: application_injection
    label: Code & application injection
    source: declared
  - namespace: collection
    value: local-content-filter
    label: Local Content Filter
    source: declared
  - namespace: guardrail_category
    value: agentic_security
    label: Agentic Security
    source: declared
  - namespace: implementation
    value: category
    label: Category
    source: derived
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: rail
    value: output
    label: Output rail
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
rules:
- rules/category-prompt_injection_sql.yaml
tests:
- tests/acceptance.yaml
resources:
- resources/category-prompt_injection_sql-conditions.yaml
- resources/category-prompt_injection_sql-always_block.yaml
- resources/category-prompt_injection_sql-exceptions.yaml
