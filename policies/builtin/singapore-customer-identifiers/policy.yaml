# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: singapore-customer-identifiers
  name: Singapore customer identifiers
  description: Redact NRIC/FIN, +65 phone and Singapore bank-account patterns. Passport detection is provided
    by the shared Passport identifiers Policy. This is bounded text screening, not PDPA compliance.
  source: built_in
  version: 2.0.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: collection
    value: focused-protection
    label: Focused protection
    source: declared
  - namespace: jurisdiction
    value: singapore
    label: Singapore
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
rules:
- rules/sg-pdpa-pii-identifiers-sg_nric.yaml
- rules/sg-pdpa-contact-information-sg_phone.yaml
- rules/sg-pdpa-financial-data-sg_bank_account.yaml
tests:
- tests/acceptance.yaml
- tests/regression.yaml
