# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: gdpr-eu-national-identifiers/eu_passport_generic
name: Passport Number (EU Generic)
description: Detects generic EU passport format (2 digits + 2 letters + 5 digits) - covers France and
  similar EU formats
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[0-9]{2}[A-Z]{2}[0-9]{5}\b
    context_expression: \b(?:passport|passeport|travel\s*document|document\s*number|reisepass|paspoort|paszport)\b
on_match:
  action: redact
  replacement: '[eu_passport_generic_REDACTED]'
runtime_adapter:
  binding_id: gdpr-eu-national-identifiers
  implementation_rule_id: eu_passport_generic
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
