# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: gdpr-eu-contact-information/fr_phone
name: Phone Number (France)
description: Detects French phone numbers in various formats (+33, 0033, or 0 prefix followed by 9 digits
  starting with 1-9)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<!\d)(?:\+33|0033|0)[1-9][0-9]{8}\b
on_match:
  action: redact
  replacement: '[fr_phone_REDACTED]'
runtime_adapter:
  binding_id: gdpr-eu-contact-information
  implementation_rule_id: fr_phone
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
