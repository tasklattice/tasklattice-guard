# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: gdpr-eu-pii-protection
  name: GDPR Art. 32 — EU PII Protection
  description: Masks configured French and EU identifier formats as a supporting security measure in GDPR-related
    deployments. Identifier matching alone does not satisfy Article 32 or other GDPR obligations.
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy & sensitive information
    source: declared
  - namespace: guardrail_category
    value: pii_detection
    label: PII Detection
    source: declared
  - namespace: framework
    value: gdpr
    label: GDPR
    source: declared
  - namespace: jurisdiction
    value: eu
    label: European Union
    source: declared
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: implementation
    value: regex
    label: Regex
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
rules:
- rules/gdpr-eu-national-identifiers-fr_nir.yaml
- rules/gdpr-eu-national-identifiers-eu_passport_generic.yaml
- rules/gdpr-eu-financial-data-eu_iban_enhanced.yaml
- rules/gdpr-eu-financial-data-iban.yaml
- rules/gdpr-eu-contact-information-email.yaml
- rules/gdpr-eu-contact-information-fr_phone.yaml
- rules/gdpr-eu-contact-information-fr_postal_code.yaml
- rules/gdpr-eu-business-identifiers-eu_vat.yaml
tests:
- tests/acceptance.yaml
