# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credentials-api-keys/aws_access_key
name: AWS Access Key
description: Detects AWS access keys (AKIA...)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(AKIA[0-9A-Z]{16})\b
on_match:
  action: block
  replacement: '[aws_access_key_REDACTED]'
runtime_adapter:
  binding_id: credentials-api-keys
  implementation_rule_id: aws_access_key
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
