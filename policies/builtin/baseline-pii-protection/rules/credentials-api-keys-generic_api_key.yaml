# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credentials-api-keys/generic_api_key
name: API Key (Generic)
description: Detects generic API key patterns
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b([Aa][Pp][Ii][-_]?[Kk][Ee][Yy][\s:=]+['"]?[A-Za-z0-9_\-]{20,}['"]?)\b
on_match:
  action: block
  replacement: '[generic_api_key_REDACTED]'
runtime_adapter:
  binding_id: credentials-api-keys
  implementation_rule_id: generic_api_key
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
