# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: credentials-api-keys/slack_token
name: Slack Token
description: Detects Slack API tokens
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(xox[pboa]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,32})\b
on_match:
  action: block
  replacement: '[slack_token_REDACTED]'
runtime_adapter:
  binding_id: credentials-api-keys
  implementation_rule_id: slack_token
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
