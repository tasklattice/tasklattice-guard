# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: nsfw-content-filter-all-regions
  name: NSFW Content Filter (All Regions)
  description: Comprehensive multi-language NSFW content filtering. Blocks profanity, sexual content,
    inappropriate requests, self-harm content, and child safety violations in English, Spanish, French,
    German, and Australian. Best for global applications.
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: content_safety
    label: Content safety
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: implementation
    value: category
    label: Category
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
rules:
- rules/nsfw-filter-english-harm_toxic_abuse.yaml
- rules/nsfw-filter-spanish-harm_toxic_abuse_es.yaml
- rules/nsfw-filter-french-harm_toxic_abuse_fr.yaml
- rules/nsfw-filter-german-harm_toxic_abuse_de.yaml
- rules/nsfw-filter-australian-harm_toxic_abuse_au.yaml
- rules/nsfw-self-harm-filter-global-harmful_self_harm.yaml
- rules/nsfw-child-safety-filter-global-harmful_child_safety.yaml
- rules/nsfw-racial-bias-filter-global-bias_racial.yaml
tests:
- tests/acceptance.yaml
resources:
- resources/nsfw-filter-english-harm_toxic_abuse-keywords.yaml
- resources/nsfw-filter-spanish-harm_toxic_abuse_es-keywords.yaml
- resources/nsfw-filter-french-harm_toxic_abuse_fr-keywords.yaml
- resources/nsfw-filter-german-harm_toxic_abuse_de-keywords.yaml
- resources/nsfw-filter-australian-harm_toxic_abuse_au-keywords.yaml
- resources/nsfw-self-harm-filter-global-harmful_self_harm-keywords.yaml
- resources/nsfw-child-safety-filter-global-harmful_child_safety-identifiers.yaml
- resources/nsfw-child-safety-filter-global-harmful_child_safety-conditions.yaml
- resources/nsfw-child-safety-filter-global-harmful_child_safety-always_block.yaml
- resources/nsfw-child-safety-filter-global-harmful_child_safety-exceptions.yaml
- resources/nsfw-racial-bias-filter-global-bias_racial-identifiers.yaml
- resources/nsfw-racial-bias-filter-global-bias_racial-conditions.yaml
- resources/nsfw-racial-bias-filter-global-bias_racial-always_block.yaml
- resources/nsfw-racial-bias-filter-global-bias_racial-exceptions.yaml
