# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: uae-data-protection-pii/uae_po_box
name: UAE Po Box
description: Custom regular-expression rule.
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[Pp]\.?[Oo]\.?\s*[Bb]ox\s*\d{1,6}\b
on_match:
  action: transform
  replacement: '[uae_po_box_REDACTED]'
runtime_adapter:
  binding_id: uae-data-protection-pii
  implementation_rule_id: uae_po_box
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
