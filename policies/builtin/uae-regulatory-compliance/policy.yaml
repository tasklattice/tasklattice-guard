# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: uae-regulatory-compliance
  name: UAE Regulatory Reference Controls
  description: Screens selected UAE identifier formats and cultural-sensitivity or anti-discrimination
    phrases as reference controls. It does not determine the applicability of UAE law or establish regulatory
    compliance.
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: business_rules
    label: Business & industry rules
    source: declared
  - namespace: guardrail_category
    value: agentic_security
    label: Agentic Security
    source: declared
  - namespace: jurisdiction
    value: uae
    label: United Arab Emirates
    source: declared
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: implementation
    value: category
    label: Category
    source: derived
  - namespace: implementation
    value: regex
    label: Regex
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
rules:
- rules/uae-data-protection-pii-uae_emirates_id.yaml
- rules/uae-data-protection-pii-uae_phone.yaml
- rules/uae-data-protection-pii-email.yaml
- rules/uae-data-protection-pii-iban.yaml
- rules/uae-data-protection-pii-credit_card.yaml
- rules/uae-data-protection-pii-uae_po_box.yaml
- rules/uae-cultural-sensitivity-filter-uae_cultural_sensitivity.yaml
- rules/uae-anti-discrimination-filter-uae_anti_discrimination.yaml
tests:
- tests/acceptance.yaml
