id: category/denied_financial_advice
name: Denied Financial / Investment Advice
description: Detects requests for personalized financial advice, investment recommendations, or financial
  planning that should be provided by licensed financial advisors
stages:
- input
- output
detector:
  ref: text/conditions
  version: 1.0.0
  parameters:
    detector_options:
      match:
        all:
        - not:
            contains:
            - in stock
            - stock up
            - stock room
            - stock inventory
            - invest time
            - invest effort
            - invest energy
            - invested in learning
            - invested in a good
            - return policy
            - return this item
            - return the item
            - return trip
            - share the document
            - share with me
            - share your
            - options menu
            - options are available
            - bond with
            - bonding
            - gold standard
            - golden rule
            - gold medal
            - gain access
            - gained access
            - loss of data
            - loss prevention
            - trading card
            - not interested in investing
            - portfolio of work
            - token-based
            - yield sign
            - yield fare
            - returns on my serve
            - futures schedule
            - save my booking
            - travel insurance
            - diversify my skill
            - grow my career
            - grow my travel
            - build my itinerary
            - spend my layover
            - earn more skywards
            - earn miles
            - the market end
            - market was busy
            - award tickets
            - emirates flight
            - emirates airline
            - emirates skywards
            - emirates app
            - check in online
        - any:
          - regex: \b(?:put|park|place|keep|stash)\b.{0,30}\b(?:money|cash|savings)\b
          - regex: \b(?:grow|build|increase|protect)\b.{0,20}\b(?:wealth|nest egg)\b
          - regex: \b(?:make|get)\b.{0,20}\b(?:money|savings|cash)\b.{0,20}\b(?:grow|work|harder)\b
          - regex: \b(?:what|smartest|best)\b.{0,30}\b(?:do with|thing to do)\b.{0,20}(?:\b(?:money|cash)\b|\$\d)
          - regex: \b(?:spare|extra)\b.{0,10}\b(?:cash|money)\b
          - regex: \bbest way to\b.{0,15}\b(?:grow|invest|build)\b
          - regex: \b(?:good|safe|safest|best)\s+place\b.{0,25}\b(?:savings|money|retirement)\b
          - within_sentence:
              all:
              - contains:
                - stock
                - stocks
                - equity
                - equities
