# yaml-language-server: $schema=../../schemas/policy.schema.json
schema_version: 2
kind: Policy
metadata:
  id: filter-denied-financial-advice
  name: Denied Financial / Investment Advice
  description: Detects requests for personalized financial advice, investment recommendations, or financial
    planning that should be provided by licensed financial advisors
  source: built_in
  version: 1.95.0
  tags:
  - namespace: protection
    value: business_rules
    label: Business & industry rules
    source: declared
  - namespace: collection
    value: local-content-filter
    label: Local Content Filter
    source: declared
  - namespace: guardrail_category
    value: content_safety
    label: Content Safety
    source: declared
  - namespace: implementation
    value: category
    label: Category
    source: derived
  - namespace: rail
    value: input
    label: Input rail
    source: derived
  - namespace: rail
    value: output
    label: Output rail
    source: derived
  safety_level: balanced
  output_delivery: window_buffered
parameters: []
rules:
- rules/category-denied_financial_advice.yaml
tests:
- tests/acceptance.yaml
resources:
- resources/category-denied_financial_advice-identifiers.yaml
- resources/category-denied_financial_advice-conditions.yaml
- resources/category-denied_financial_advice-always_block.yaml
- resources/category-denied_financial_advice-exceptions.yaml
