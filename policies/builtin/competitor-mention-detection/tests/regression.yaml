  phase: input
  content: Qatar lounge access rules
  expected_decision: allow
  covered_rule_ids:
  - competitor/intent
  kind: scenario
  required: true
  parameter_names: []
  group: Ambiguous entity
- id: competitor-comparison-input-filter/ambiguous-entity-003
  name: Allow ambiguous check-in question
