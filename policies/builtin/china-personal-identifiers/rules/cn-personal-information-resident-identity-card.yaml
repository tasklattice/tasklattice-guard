# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: cn-personal-information/resident-identity-card
name: PRC resident identity card number
description: Redacts 18-character resident identity card candidates only after birth-date and MOD 11-2
  checksum validation. It does not verify issuance, holder identity, or the six-digit administrative division
  code.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<![0-9])[1-9][0-9]{5}(?:18|19|20)[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx](?![0-9])
    validators:
    - type: date
      start: 6
      format: YYYYMMDD
    - type: weighted_checksum
      alphabet: 0123456789
      weights:
      - 7
      - 9
      - 10
      - 5
      - 8
      - 4
      - 2
      - 1
      - 6
      - 3
      - 7
      - 9
      - 10
      - 5
      - 8
      - 4
      - 2
      check_characters: 10X98765432
on_match:
  action: transform
  replacement: '[cn_resident_id_REDACTED]'
runtime_adapter:
  binding_id: china-personal-identifiers
  implementation_rule_id: cn-personal-information/resident-identity-card
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
