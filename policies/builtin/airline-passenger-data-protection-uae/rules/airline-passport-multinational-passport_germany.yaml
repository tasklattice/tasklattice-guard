# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: airline-passport-multinational/passport_germany
name: Passport (Germany)
description: German passport numbers (9 alphanumeric, no vowels)
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[CFGHJKLMNPRTVWXYZ0-9]{9}\b
on_match:
  action: redact
  replacement: '[passport_germany_REDACTED]'
runtime_adapter:
  binding_id: airline-passport-multinational
  implementation_rule_id: passport_germany
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
