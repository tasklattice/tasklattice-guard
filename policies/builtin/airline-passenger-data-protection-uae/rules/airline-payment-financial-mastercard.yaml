# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: airline-payment-financial/mastercard
name: Credit Card (Mastercard)
description: Detects Mastercard credit card numbers
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b5[1-5]\d{2}[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b
on_match:
  action: transform
  replacement: '[mastercard_REDACTED]'
runtime_adapter:
  binding_id: airline-payment-financial
  implementation_rule_id: mastercard
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
risk_level: high
