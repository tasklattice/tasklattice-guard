# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: airline-payment-financial/amex
name: Credit Card (American Express)
description: Detects American Express credit card numbers
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b3[47]\d{2}[\s\-]?\d{6}[\s\-]?\d{5}\b
on_match:
  action: redact
  replacement: '[amex_REDACTED]'
runtime_adapter:
  binding_id: airline-payment-financial
  implementation_rule_id: amex
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
risk_level: high
