# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: internet/session-theft
name: Session theft
description: Matches this reviewed text pattern, not arbitrary semantic variants.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\b(?:steal|exfiltrate)\s+(?:the\s+)?(?:user|customer)\s+session\s+cookies\b|窃取(?:用户|客户)的会话(?:Cookie|令牌)
on_match:
  action: block
runtime_adapter:
  binding_id: internet-account-abuse
  implementation_rule_id: internet/session-theft
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
risk_level: high
