schema_version: 1
kind: Policy
metadata:
  id: local-injection-protection
  name: Local Injection Protection
  description: Instruction manipulation, prompt extraction, SQL, code and rendered-content
    injection patterns in English and Chinese.
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: attacks_and_abuse
    label: Attacks And Abuse
    source: declared
  - namespace: guardrail_category
    value: jailbreak_protection
    label: Jailbreak Protection
    source: declared
  - namespace: jurisdiction
    value: cn
    label: China mainland
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters: []
execution:
  mode: sequential
  input: previous_output
  stop_on: block
rules: []
tests:
- tests/acceptance.yaml
