schema_version: 1
kind: Policy
metadata:
  id: pii-semantic
  name: PII (Semantic)
  description: 'Target taxonomy Policy: PII (Semantic).'
  source: built_in
  version: 1.1.0
  tags:
  - namespace: protection
    value: privacy
    label: Privacy
  - namespace: collection
    value: policy-library
    label: Policy Library
  - namespace: framework
    value: owasp-llm-2025
    label: OWASP LLM 2025
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters:
- name: on_unknown
  label: Uncertain result action
  kind: text
  required: false
  placeholder: block or allow
  description: Block valid uncertain results by default. Allow continues only this
    Rule; other Policies and failure handling still apply.
  default: block
- name: review_unknown
  label: Review uncertain results
  kind: text
  required: false
  placeholder: true or false
  description: Review valid JEV/Laya uncertainty using the separately validated
    classifier_review binding for this input/output stage. Confirmed PII uses the
    configured action and the detector's trusted whole-block redaction.
  default: 'false'
rules: []
rule_refs:
- id: model/pii
  version: 1.1.0
tests:
- tests/acceptance.yaml
