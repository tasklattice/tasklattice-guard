schema_version: 1
kind: Policy
metadata:
  id: content-filters
  name: Content Filters
  description: 'Target taxonomy Policy: Content Filters.'
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: content_filters
    label: Content Filters
  - namespace: collection
    value: policy-library
    label: Policy Library
  safety_level: balanced
  output_delivery: full_buffered
parameters:
- name: brand_name
  label: Your Brand Name
  kind: text
  required: true
  placeholder: e.g. Acme Airlines
  description: ''
  default: null
- name: competitors
  label: Competitors
  kind: textarea
  required: true
  placeholder: One competitor per line
  description: Paste the reviewed competitor set used by this Policy.
  default: null
- name: phrase_entries
  label: Phrases and actions
  kind: phrase_entries
  required: true
  placeholder: ''
  description: Entries run in order within this Policy. Replacement text continues
    to the next entry; a block ends execution.
  default: null
- name: blocked_words
  label: Blocked words and phrases
  kind: textarea
  required: true
  placeholder: One word or phrase per line
  description: The reviewed local deny-list for this Guardrail binding.
  default: null
rules: []
rule_refs:
- id: competitor/intent
  version: 1.0.0
- id: configured/phrases
  version: 1.0.0
- id: keyword/blocked-words
  version: 1.0.0
tests:
- tests/acceptance.yaml
testing:
  parameters:
    brand_name: TaskLattice
    competitors: ExampleCompetitor
    phrase_entries: '[{"id": "secret", "phrase": "INTERNAL_SECRET", "action": "block"}]'
    blocked_words: INTERNAL_SECRET
