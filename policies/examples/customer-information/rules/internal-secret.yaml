# yaml-language-server: $schema=../../../schemas/rule.schema.json
id: internal-secret
name: 阻断内部密钥标签
stages:
- output
detector:
  ref: text/keyword
  version: 1.0.0
  parameters:
    keywords:
    - - INTERNAL_SECRET
      - high
risk_level: high
on_match:
  action: block
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-CREDENTIAL
