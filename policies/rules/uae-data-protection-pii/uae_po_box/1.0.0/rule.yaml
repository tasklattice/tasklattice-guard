id: uae-data-protection-pii/uae_po_box
version: 1.0.0
name: UAE Po Box
description: Custom regular-expression rule.
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[Pp]\.?[Oo]\.?\s*[Bb]ox\s*\d{1,6}\b
on_match:
  action: transform
  replacement: '[uae_po_box_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: uae-data-protection-pii/uae_po_box
