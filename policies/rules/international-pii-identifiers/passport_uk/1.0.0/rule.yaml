id: international-pii-identifiers/passport_uk
version: 1.0.0
name: Passport (UK)
description: UK passport numbers (9 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[0-9]{9}\b
on_match:
  action: transform
  replacement: '[passport_uk_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: international-pii-identifiers/passport_uk
