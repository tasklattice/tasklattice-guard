id: international-pii-identifiers/passport_japan
version: 1.0.0
name: Passport (Japan)
description: Japanese passport numbers (2 letters + 7 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[A-Z]{2}[0-9]{7}\b
on_match:
  action: transform
  replacement: '[passport_japan_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: international-pii-identifiers/passport_japan
