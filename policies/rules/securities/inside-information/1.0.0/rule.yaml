id: securities/inside-information
version: 1.0.0
name: Trading on inside information
description: Matches this reviewed text pattern, not arbitrary semantic variants.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)\b(?:trade|buy|sell)\s+(?:on|using)\s+(?:non[- ]public|inside)\s+information\b|利用(?:内幕|未公开)信息(?:买卖|交易|炒股)
on_match:
  action: block
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-fraud-prevention
  implementation_rule_id: securities/inside-information
