id: category/denied_financial_advice
version: 1.0.1
name: Denied Financial / Investment Advice
description: Detects investment recommendations and requests for financial decisions; neutral market discussion
  and unrelated sharing are insufficient.
stages:
- input
- output
detector:
  ref: text/conditions
  version: 1.0.0
  parameters:
    detector_options:
      match:
        all:
        - not:
            contains:
            - in stock
            - stock up
            - stock room
            - stock inventory
            - invest time
            - invest effort
            - invest energy
            - invested in learning
            - invested in a good
            - return policy
            - return this item
            - return the item
            - return trip
            - share the document
            - share with me
            - share your
            - options menu
            - options are available
            - bond with
            - bonding
            - gold standard
            - golden rule
            - gold medal
            - gain access
            - gained access
            - loss of data
            - loss prevention
            - trading card
            - not interested in investing
            - portfolio of work
            - token-based
            - yield sign
            - yield fare
            - returns on my serve
            - futures schedule
            - save my booking
            - travel insurance
            - diversify my skill
            - grow my career
            - grow my travel
            - build my itinerary
            - spend my layover
            - earn more skywards
            - earn miles
            - the market end
            - market was busy
            - award tickets
            - emirates flight
            - emirates airline
            - emirates skywards
            - emirates app
            - check in online
        - any:
          - regex: \b(?:put|park|place|keep|stash)\b.{0,30}\b(?:money|cash|savings)\b
          - regex: \b(?:grow|build|increase|protect)\b.{0,20}\b(?:wealth|nest egg)\b
          - regex: \b(?:make|get)\b.{0,20}\b(?:money|savings|cash)\b.{0,20}\b(?:grow|work|harder)\b
          - regex: \b(?:what|smartest|best)\b.{0,30}\b(?:do with|thing to do)\b.{0,20}(?:\b(?:money|cash)\b|\$\d)
          - regex: \b(?:spare|extra)\b.{0,10}\b(?:cash|money)\b
          - regex: \bbest way to\b.{0,15}\b(?:grow|invest|build)\b
          - regex: \b(?:good|safe|safest|best)\s+place\b.{0,25}\b(?:savings|money|retirement)\b
          - within_sentence:
              all:
              - keywords:
                - stock
                - stocks
                - equity
                - equities
                - shares
                - ticker
                - nasdaq
                - dow jones
                - s&p 500
                - nyse
                - ftse
                - nikkei
                - dax
                - sensex
                - blue chip
                - penny stocks
                - securities
                - bond
                - bonds
                - treasury
                - fixed income
                - mutual fund
                - etf
                - index fund
                - hedge fund
                - funds
                - crypto
                - cryptocurrency
                - bitcoin
                - ethereum
                - blockchain
                - portfolio
                - portfolios
                - brokerage
                - trading
                - forex
                - day trading
                - options trading
                - futures trading
                - commodities
                - short selling
                - derivatives
                - dividend
                - capital gains
                - ipo
                - reit
                - market cap
                - market capitalization
                - 401k
                - ira
                - roth
                - pension
                - annuity
                - financial advisor
                - financial planner
                - wealth management
                - robo-advisor
                - vanguard
                - fidelity
                - schwab
                - robinhood
                - invest
                - investing
                - investment
                - investments
                - investors
                - gold
                - silver
                - commodity
                - savings account
                - money market
                - compound interest
                - capital markets
                - passive income
              - regex: \b(?:should\s+(?:i|we)|recommend(?:ation|ations)?|advise|advice|suggest(?:ion)?|which\s+(?:stocks?|funds?|investments?)|best\s+(?:stocks?|funds?|investment)|how\s+(?:can|do|should)\s+(?:i|we)\s+(?:invest|trade|allocate|diversify)|(?:buy|sell|allocate|invest)\s+(?:my|our|your))\b
          - keywords:
            - should i invest
            - investment advice
            - financial advice
            - how to invest
            - how to trade
            - stock tips
            - trading tips
            - best stocks to buy
            - best crypto to buy
            - best etf
            - best mutual fund
            - best index fund
            - market prediction
            - stock market forecast
            - retirement planning
            - grow my wealth
            - build wealth
            - is bitcoin a good investment
            - is gold a safe investment
            - is real estate a good investment
            - protect my wealth
            - dollar cost averaging
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PROFESSIONAL-ADVICE-FINANCIAL
runtime_adapter:
  binding_id: local-professional-advice
  implementation_rule_id: category/denied_financial_advice
