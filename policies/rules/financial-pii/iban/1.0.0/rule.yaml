id: financial-pii/iban
version: 1.0.0
name: IBAN (International Bank Account Number)
description: Detects IBANs (2 letter country code + 2 check digits + 4 char bank code + 7 digit base + optional
  0-16 alphanumeric)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b
on_match:
  action: transform
  replacement: '[iban_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
runtime_adapter:
  binding_id: local-payment-data
  implementation_rule_id: financial-pii/iban
