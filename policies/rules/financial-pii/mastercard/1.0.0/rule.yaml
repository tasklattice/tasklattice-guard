id: financial-pii/mastercard
version: 1.0.0
name: Credit Card (Mastercard)
description: Detects Mastercard credit card numbers
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b5[1-5]\d{2}[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b
on_match:
  action: transform
  replacement: '[mastercard_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
runtime_adapter:
  binding_id: local-payment-data
  implementation_rule_id: financial-pii/mastercard
