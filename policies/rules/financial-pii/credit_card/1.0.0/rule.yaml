id: financial-pii/credit_card
version: 1.0.0
name: Credit Card (Any)
description: Detects any major credit card number
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?:\b4\d{3}[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b|\b5[1-5]\d{2}[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b|\b3[47]\d{2}[\s\-]?\d{6}[\s\-]?\d{5}\b|\b6(?:011|5\d{2})[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b)
on_match:
  action: transform
  replacement: '[credit_card_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
runtime_adapter:
  binding_id: local-payment-data
  implementation_rule_id: financial-pii/credit_card
