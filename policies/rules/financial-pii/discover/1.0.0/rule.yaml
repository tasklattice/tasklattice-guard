id: financial-pii/discover
version: 1.0.0
name: Credit Card (Discover)
description: Detects Discover credit card numbers
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b6(?:011|5\d{2})[\s\-]?\d{4}[\s\-]?\d{4}[\s\-]?\d{4}\b
on_match:
  action: transform
  replacement: '[discover_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-FINANCIAL
runtime_adapter:
  binding_id: local-payment-data
  implementation_rule_id: financial-pii/discover
