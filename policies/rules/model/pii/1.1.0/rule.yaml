id: model/pii
version: 1.1.0
name: PII detector
description: Redact detected PII, with optional independent review of uncertainty.
stages:
- input
- output
detector:
  ref: model/classifier
  version: 1.0.0
  parameters:
    profile: pii-classification
    on_unknown: '{{on_unknown}}'
    review_unknown: '{{review_unknown}}'
on_match:
  action: transform
runtime_adapter:
  binding_id: pii
  implementation_rule_id: pii
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
risk_level: medium
