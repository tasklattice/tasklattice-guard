id: identity/passport
version: 1.0.0
name: Contextual passport identifier
description: Matches this reviewed text pattern, not arbitrary semantic variants.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?i)(?:\bpassport(?:\s+(?:number|no\.?))?|护照(?:号码|号)?)\s*(?:is\s+)?[:：#]?\s*(?=[A-Z0-9]*[0-9])[A-Z0-9]{6,9}\b
on_match:
  action: transform
  replacement: '[REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: identity/passport
