id: pattern/fr_phone
version: 1.0.0
name: Phone Number (France)
description: Detects French phone numbers in various formats (+33, 0033, or 0 prefix followed by 9 digits starting
  with 1-9)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<!\d)(?:\+33|0033|0)[1-9][0-9]{8}\b
on_match:
  action: transform
  replacement: '[fr_phone_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/fr_phone
