id: pattern/sg_nric
version: 1.0.0
name: NRIC/FIN (Singapore National ID)
description: Detects Singapore NRIC and FIN numbers (S/T for citizens/PRs, F/G/M for foreigners + 7 digits
  + checksum letter)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[STFGM]\d{7}[A-Z]\b
on_match:
  action: transform
  replacement: '[sg_nric_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/sg_nric
