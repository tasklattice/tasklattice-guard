id: pattern/br_cep
version: 1.0.0
name: CEP - Brazilian Zip / Postal Code
description: Detects Brazilian CEP postal codes (XXXXX-XXX or XXXXXXXX format)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{5}-?\d{3}\b
on_match:
  action: transform
  replacement: '[br_cep_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/br_cep
