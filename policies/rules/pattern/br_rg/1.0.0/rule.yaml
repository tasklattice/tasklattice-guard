id: pattern/br_rg
version: 1.0.0
name: RG - Brazilian National Identity Card (SP, RJ, MG)
description: Detects Brazilian RG identity card numbers (common pattern for SP, RJ, MG states)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{1,2}\.\d{3}\.\d{3}-[\dXx]\b
on_match:
  action: transform
  replacement: '[br_rg_REDACTED]'
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/br_rg
