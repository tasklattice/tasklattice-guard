id: pattern/uae_phone
version: 1.0.0
name: Phone Number (UAE)
description: Detects UAE phone numbers (+971/00971/0 prefix, landline and mobile)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<!\d)(?:\+971|00971|0)\s?(?:2|3|4|6|7|9|50|52|54|55|56|58)\s?\d{3}\s?\d{4}\b
on_match:
  action: transform
  replacement: '[uae_phone_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: pattern/uae_phone
