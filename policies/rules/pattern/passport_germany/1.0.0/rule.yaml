id: pattern/passport_germany
version: 1.0.0
name: Passport (Germany)
description: German passport numbers (9 alphanumeric, no vowels)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[CFGHJKLMNPRTVWXYZ0-9]{9}\b
on_match:
  action: transform
  replacement: '[passport_germany_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: pattern/passport_germany
