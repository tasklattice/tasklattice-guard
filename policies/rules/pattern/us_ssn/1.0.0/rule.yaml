id: pattern/us_ssn
version: 1.0.0
name: SSN (Social Security Number)
description: Detects US Social Security Numbers (XXX-XX-XXXX format)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{3}-\d{2}-\d{4}\b
on_match:
  action: transform
  replacement: '[us_ssn_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/us_ssn
