id: pattern/br_cpf_unformatted
version: 1.0.0
name: CPF - Brazilian Personal Tax ID (Unformatted)
description: Detects Brazilian CPF numbers without formatting (11 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{11}\b
on_match:
  action: transform
  replacement: '[br_cpf_unformatted_REDACTED]'
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/br_cpf_unformatted
