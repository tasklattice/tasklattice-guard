id: pattern/passport_france
version: 1.0.0
name: Passport (France)
description: French passport numbers (2 digits, 2 letters, 5 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[0-9]{2}[A-Z]{2}[0-9]{5}\b
on_match:
  action: transform
  replacement: '[passport_france_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: pattern/passport_france
