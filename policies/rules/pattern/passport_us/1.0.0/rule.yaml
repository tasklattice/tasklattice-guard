id: pattern/passport_us
version: 1.0.0
name: Passport (US)
description: US passport numbers (9 digits or alphanumeric letter + 8 digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b([A-Z][0-9]{8}|[0-9]{9})\b
on_match:
  action: transform
  replacement: '[passport_us_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: pattern/passport_us
