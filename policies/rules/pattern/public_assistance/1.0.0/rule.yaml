id: pattern/public_assistance
version: 1.0.0
name: Public Assistance Status (Protected Class)
description: Detects public assistance terms - protected under ECOA
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(welfare|public\s+assistance|food\s+stamps|SNAP|WIC|TANF|medicaid|section\s+8|housing\s+voucher|subsidized\s+housing|public\s+housing|government\s+benefits|social\s+services|unemployment\s+(benefits|insurance)|UI\s+benefits|EBT|benefit\s+recipient)\b
on_match:
  action: transform
  replacement: '[public_assistance_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-SENSITIVE-ATTRIBUTE
runtime_adapter:
  binding_id: local-sensitive-attribute-terms
  implementation_rule_id: pattern/public_assistance
