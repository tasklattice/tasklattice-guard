id: pattern/race_ethnicity_national_origin
version: 1.0.6
name: Race, Ethnicity & National Origin (Protected Class)
description: Detects race, ethnicity and national origin terms - protected under ECOA and Fair Housing Act. Disambiguates local professional, technical or cultural phrases, ethnicity or nationality adjectives that describe an economy, market, government, country or institution rather than a person, and language names used for translation or language learning; other sensitive matches in the same text remain protected.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?:(?:\b(caucasian|african[- ]?american|black|white|asian|hispanic|latino|latina|latinx|pacific\s+islander|native\s+american|indigenous|first\s+nations|aboriginal|mestizo|mulatto|biracial|multiracial|mixed[- ]?race|person\s+of\s+colou?r|POC|BIPOC|ethnic(ity)?|racial|race|arab|middle\s+eastern|south\s+asian|east\s+asian|southeast\s+asian|european|african|caribbean|west\s+indian|haitian|jamaican|cuban|puerto\s+rican|mexican|dominican|salvadoran|guatemalan|honduran|colombian|venezuelan|peruvian|brazilian|chinese|japanese|korean|vietnamese|filipino|filipina|indian|pakistani|bangladeshi|sri\s+lankan|nepali|thai|indonesian|malaysian|burmese|cambodian|laotian|hmong|somali|ethiopian|nigerian|ghanaian|kenyan|south\s+african|egyptian|moroccan|algerian|iranian|iraqi|syrian|lebanese|palestinian|israeli|turkish|afghan|uzbek|kazakh|russian|ukrainian|polish|german|italian|irish|british|french|spanish|portuguese|greek|albanian|serbian|croatian|bosnian|romani|roma|gypsy|jewish|ashkenazi|sephardic|mizrahi|native\s+hawaiian|samoan|tongan|fijian|guamanian|chamorro|inuit|aleut|metis|maori|aboriginal\s+australian|torres\s+strait)\b)\s+(?:(?:art|museum|historical|ancient|traditional|modern|language|cultural|food)\s+){0,2}(?:collections?|artifacts?|artefacts?|cuisine|cooking|recipes?|dishes?|restaurants?|languages?|grammar|vocabulary|literature|poetry|architecture|paintings?|sculptures?|ceramics|pottery|art|museums?)\b|\b(?:black|white)\s+(?:screens?|backgrounds?|pixels?|boxes?|boards?|text|buttons?|colors?|colours?)\b|\brace(?:[\s-]+conditions?|\s+(?:cars?|tracks?))\b|(?i:\b(?:african|american|arab|asian|australian|british|canadian|caribbean|chinese|dutch|east\s+asian|egyptian|european|french|german|greek|indian|indonesian|iranian|irish|israeli|italian|japanese|jewish|kenyan|korean|latin\s+american|latino|mexican|middle\s+eastern|nigerian|nordic|pakistani|polish|portuguese|russian|scandinavian|scottish|south\s+asian|southeast\s+asian|spanish|swedish|swiss|thai|turkish|ukrainian|vietnamese|western)\s+(?:economy|economies|market|markets|government|governments|politics|culture|cultures|weather|industry|industries|society|societies|history|media|law|laws|cities|city|companies|company|exports|imports|currency|stocks?|team|teams|countries|country|nations?|states?|regions?|bloc|union|continent)\b)|(?i:\b(?:translate|translates|translated|translating|speak|speaks|speaking|learn|learning|study|studying)\s+(?:to\s+|into\s+)?(?:arabic|chinese|danish|czech|dutch|finnish|french|german|greek|hebrew|hindi|hungarian|indonesian|irish|italian|japanese|korean|latin|norwegian|polish|portuguese|romanian|russian|spanish|swedish|thai|turkish|ukrainian|vietnamese)\b)|(?i:\b(?:in|into|from)\s+(?:arabic|chinese|danish|czech|dutch|finnish|french|german|greek|hebrew|hindi|hungarian|indonesian|irish|italian|japanese|korean|latin|norwegian|polish|portuguese|romanian|russian|spanish|swedish|thai|turkish|ukrainian|vietnamese)\b))|(?P<attribute>\b(caucasian|african[- ]?american|black|white|asian|hispanic|latino|latina|latinx|pacific\s+islander|native\s+american|indigenous|first\s+nations|aboriginal|mestizo|mulatto|biracial|multiracial|mixed[- ]?race|person\s+of\s+colou?r|POC|BIPOC|ethnic(ity)?|racial|race|arab|middle\s+eastern|south\s+asian|east\s+asian|southeast\s+asian|european|african|caribbean|west\s+indian|haitian|jamaican|cuban|puerto\s+rican|mexican|dominican|salvadoran|guatemalan|honduran|colombian|venezuelan|peruvian|brazilian|chinese|japanese|korean|vietnamese|filipino|filipina|indian|pakistani|bangladeshi|sri\s+lankan|nepali|thai|indonesian|malaysian|burmese|cambodian|laotian|hmong|somali|ethiopian|nigerian|ghanaian|kenyan|south\s+african|egyptian|moroccan|algerian|iranian|iraqi|syrian|lebanese|palestinian|israeli|turkish|afghan|uzbek|kazakh|russian|ukrainian|polish|german|italian|irish|british|french|spanish|portuguese|greek|albanian|serbian|croatian|bosnian|romani|roma|gypsy|jewish|ashkenazi|sephardic|mizrahi|native\s+hawaiian|samoan|tongan|fijian|guamanian|chamorro|inuit|aleut|metis|maori|aboriginal\s+australian|torres\s+strait)\b)
    detector_options:
      capture_group: attribute
on_match:
  action: transform
  replacement: '[race_ethnicity_national_origin_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-SENSITIVE-ATTRIBUTE
runtime_adapter:
  binding_id: local-sensitive-attribute-terms
  implementation_rule_id: pattern/race_ethnicity_national_origin
