id: pattern/disability
version: 1.0.1
name: Disability Status (Protected Class)
description: Detects disability-related terms - protected under ECOA and ADA Disambiguates local professional, technical
  or cultural phrases per occurrence; other sensitive matches in the same text remain protected.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?:\b(?:tracing|logging|debugging|telemetry|cache|caching|cookies|javascript|notifications?|features?|services?|plugins?|extensions?|buttons?|controls?|accounts?|ports?|authentication|verification|security\s+checks?)\s+(?:(?:is|are|was|were|be|been|remains?|gets?|will\s+be|has\s+been|have\s+been)\s+)?(?:(?:temporarily|permanently|currently|automatically|normally)\s+)?disabled\b|\bdisabled\s+(?:buttons?|controls?|features?|services?|plugins?|extensions?|ports?|accounts?|logging|tracing|cache|notifications?)\b)|(?P<attribute>\b(disabled|disabilit(y|ies)|handicap(ped)?|impair(ed|ment|ments)?|wheelchair|blind(ness)?|deaf(ness)?|hard\s+of\s+hearing|hearing\s+impaired|visually\s+impaired|mute|paralyz(ed|is)|quadriplegic|paraplegic|amputee|prosthetic|cripple[d]?|mentally\s+ill|mental\s+illness|mental\s+disorder|psychiatric|schizophren(ia|ic)|bipolar|depression|depressed|anxiety\s+disorder|PTSD|autis(m|tic)|asperger'?s?|ADHD|(?-i:ADD)|attention[\s-]+deficit\s+disorder|dyslexia|dyslexic|learning\s+disabilit(y|ies)|intellectual\s+disabilit(y|ies)|down'?s?\s+syndrome|cerebral\s+palsy|epilep(sy|tic)|seizure\s+disorder|multiple\s+sclerosis|MS\s+patient|parkinson'?s?|alzheimer'?s?|dementia|chronic\s+illness|chronic\s+pain|fibromyalgia|lupus|crohn'?s?|cancer\s+patient|HIV|AIDS|diabetic|diabetes|SSI|SSDI|disability\s+benefits|disability\s+income|ADA|reasonable\s+accommodation|special\s+needs|service\s+animal|service\s+dog|guide\s+dog)\b)
    detector_options:
      capture_group: attribute
on_match:
  action: transform
  replacement: '[disability_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-SENSITIVE-ATTRIBUTE
runtime_adapter:
  binding_id: local-sensitive-attribute-terms
  implementation_rule_id: pattern/disability
