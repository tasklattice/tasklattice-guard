id: pattern/url
version: 1.0.0
name: URL
description: Detects URLs (http/https)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:https?://|www\.)[^\s/$.?#].[^\s]*\b
on_match:
  action: transform
  replacement: '[url_REDACTED]'
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-network-addresses
  implementation_rule_id: pattern/url
