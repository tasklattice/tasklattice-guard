id: pattern/br_cpf
version: 1.0.0
name: CPF - Brazilian Personal Tax ID (Formatted)
description: Detects Brazilian CPF numbers (XXX.XXX.XXX-XX or XXX.XXX.XXX/XX format)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \d{3}\.\d{3}\.\d{3}(-|/)\d{2}
on_match:
  action: transform
  replacement: '[br_cpf_REDACTED]'
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/br_cpf
