id: pattern/passport_canada
version: 1.0.0
name: Passport (Canada)
description: 'Canadian passport numbers (old: 2 letters + 6 digits; new: 1 letter + 6 digits + 2 letters)'
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b([A-Z]{2}[0-9]{6}|[A-Z][0-9]{6}[A-Z]{2})\b
on_match:
  action: transform
  replacement: '[passport_canada_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-passports
  implementation_rule_id: pattern/passport_canada
