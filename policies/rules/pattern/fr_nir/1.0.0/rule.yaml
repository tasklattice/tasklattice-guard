id: pattern/fr_nir
version: 1.0.0
name: NIR/INSEE (French Social Security Number)
description: 'Detects French National Identification Number (Numéro d''Inscription au Répertoire) - 15 digits
  with specific format: sex + year + month + department + commune + order + key'
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b[12][0-9]{2}(0[1-9]|1[0-2])[0-9]{2}[0-9]{3}[0-9]{3}[0-9]{2}\b
on_match:
  action: transform
  replacement: '[fr_nir_REDACTED]'
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/fr_nir
