id: pattern/age_discrimination
version: 1.0.1
name: Age-Related Terms (Protected Class)
description: Detects age-related terms - protected under ECOA for applicants 62+ Disambiguates local professional,
  technical or cultural phrases per occurrence; other sensitive matches in the same text remain protected.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?:\b(?:senior|junior)\s+(?:(?:staff|principal|software|hardware|product|project|program|account|sales|marketing|data|research|security|support|design|technical|systems?|network|quality|assurance|vice|executive)\s+){0,3}(?:engineers?|developers?|managers?|analysts?|designers?|architects?|consultants?|directors?|officers?|presidents?|editors?|administrators?|researchers?|associates?)\b)|(?P<attribute>\b(elderly|senior\s+citizens?|seniors?|old\s+age|aged\s+\d+|retirees?|retired|pensioners?|baby\s+boomers?|boomers?|geriatric|over\s+the\s+hill|too\s+old|too\s+young|young\s+person|millennials?|gen[-
      ]?z|junior|age\s+discrimination|ageism|years?\s+old|\d+\s*years?\s*old|over\s+\d+|under\s+\d+|older\s+workers?|older\s+employees?|older\s+candidates?|in\s+their\s+\d{2}s?|date\s+of\s+birth|DOB|birth\s*date|born\s+in\s+\d{4}|age\s+\d{2,3})\b)
    detector_options:
      capture_group: attribute
on_match:
  action: transform
  replacement: '[age_discrimination_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-SENSITIVE-ATTRIBUTE
runtime_adapter:
  binding_id: local-sensitive-attribute-terms
  implementation_rule_id: pattern/age_discrimination
