id: pattern/uae_emirates_id
version: 1.0.0
name: UAE Emirates ID
description: Detects UAE Emirates ID numbers (784-YYYY-NNNNNNN-C format, 15 digits starting with 784)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b784-?\d{4}-?\d{7}-?\d\b
on_match:
  action: transform
  replacement: '[uae_emirates_id_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: pattern/uae_emirates_id
