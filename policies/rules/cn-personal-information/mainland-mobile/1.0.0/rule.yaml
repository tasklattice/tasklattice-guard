id: cn-personal-information/mainland-mobile
version: 1.0.0
name: China mainland mobile number
description: Redacts standalone +86/86-prefixed or domestic 11-digit mobile-number patterns. It does not verify
  allocation, ownership, or whether a number identifies a person in context.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?<![0-9])(?:\+?86[\s-]?)?1[3-9][0-9]{9}(?![0-9])
on_match:
  action: transform
  replacement: '[cn_mobile_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-contact-data
  implementation_rule_id: cn-personal-information/mainland-mobile
