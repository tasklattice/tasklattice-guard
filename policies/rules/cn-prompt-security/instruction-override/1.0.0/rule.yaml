id: cn-prompt-security/instruction-override
version: 1.0.0
name: Chinese instruction override
description: Rejects selected explicit Chinese phrases that ask the model to ignore, override, or bypass trusted
  instructions. It does not detect arbitrary paraphrases or establish instruction trust.
stages:
- input
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: (?:忽略|无视|绕过|覆盖).{0,8}(?:之前|此前|以上|原有|系统|开发者).{0,6}(?:指令|提示词|规则)
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-MODEL-SECURITY-PROMPT-INJECTION
runtime_adapter:
  binding_id: local-injection-protection
  implementation_rule_id: cn-prompt-security/instruction-override
