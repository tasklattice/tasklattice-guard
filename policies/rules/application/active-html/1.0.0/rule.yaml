id: application/active-html
version: 1.0.0
name: Active HTML payload
description: Matches this reviewed text pattern, not arbitrary semantic variants.
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: '(?i)<\s*script\b|\bon(?:error|load)\s*=|javascript\s*:'
on_match:
  action: block
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-MODEL-SECURITY
runtime_adapter:
  binding_id: local-injection-protection
  implementation_rule_id: application/active-html
