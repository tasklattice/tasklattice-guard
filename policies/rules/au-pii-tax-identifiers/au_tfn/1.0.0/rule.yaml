id: au-pii-tax-identifiers/au_tfn
version: 1.0.0
name: TFN (Australian Tax File Number)
description: Detects Australian Tax File Numbers (8-9 digits) only when near TFN/tax file context to avoid
  false positives on arbitrary numbers
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:\d{3}\s?\d{3}\s?\d{3}|\d{2}\s?\d{3}\s?\d{3})\b
    context_expression: \b(?:TFN|T\.F\.N\.|tax\s*file\s*(?:number|no\.?)|tax\s*file\s*#?|ATO\s*number)\b
on_match:
  action: transform
  replacement: '[au_tfn_REDACTED]'
risk_level: medium
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-PII
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: au-pii-tax-identifiers/au_tfn
