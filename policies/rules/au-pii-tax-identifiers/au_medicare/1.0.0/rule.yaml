id: au-pii-tax-identifiers/au_medicare
version: 1.0.0
name: Medicare Number (Australia)
description: Detects Australian Medicare numbers (formatted XXXX XXXXX X or 11 consecutive digits)
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b(?:\d{4}\s?\d{5}\s?\d{1}|\d{11})\b
on_match:
  action: transform
  replacement: '[au_medicare_REDACTED]'
risk_level: high
metadata:
  taxonomy_ids:
  - TALI-PRIVACY-HEALTH
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: au-pii-tax-identifiers/au_medicare
