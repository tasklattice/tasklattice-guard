id: au-pii-tax-identifiers/au_abn
version: 1.0.0
name: ABN (Australian Business Number)
description: 'Detects Australian Business Numbers (11 digits, optional spaces: XX XXX XXX XXX)'
stages:
- input
- output
detector:
  ref: text/regex
  version: 1.0.0
  parameters:
    expression: \b\d{2}\s?\d{3}\s?\d{3}\s?\d{3}\b
on_match:
  action: transform
  replacement: '[au_abn_REDACTED]'
risk_level: low
metadata:
  taxonomy_ids:
  - TALI-BUSINESS-POLICY
runtime_adapter:
  binding_id: local-government-identifiers
  implementation_rule_id: au-pii-tax-identifiers/au_abn
