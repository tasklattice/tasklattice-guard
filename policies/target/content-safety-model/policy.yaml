schema_version: 1
kind: Policy
metadata:
  id: content-safety-model
  name: Content Safety (Model)
  description: 'Target taxonomy Policy: Content Safety (Model).'
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: content_safety
    label: Content Safety
  - namespace: collection
    value: target-policies
    label: Target Policies
  safety_level: balanced
  output_delivery: full_buffered
parameters:
- name: on_unknown
  label: Uncertain result action
  kind: text
  required: false
  placeholder: block or allow
  description: block (default) blocks valid uncertain results; allow continues this
    Rule without skipping other Policies. Matches, errors and missing context keep
    their own handling.
  default: block
- name: review_unknown
  label: Review uncertain results
  kind: text
  required: false
  placeholder: true or false
  description: When true, a valid JEV/Laya gray-area result is reviewed by the separately
    validated classifier_review binding for the current input/output stage. Matches,
    errors and missing context keep their handling.
  default: 'false'
rules: []
rule_refs:
- id: model/content-safety
  version: 1.0.0
tests:
- tests/acceptance.yaml
