schema_version: 1
kind: Policy
metadata:
  id: prompt-instruction-attacks
  name: Prompt & Instruction Attacks
  description: 'Target taxonomy Policy: Prompt & Instruction Attacks.'
  source: built_in
  version: 1.0.0
  tags:
  - namespace: protection
    value: attacks_and_abuse
    label: Attacks And Abuse
  - namespace: collection
    value: target-policies
    label: Target Policies
  - namespace: framework
    value: owasp-llm-2025
    label: OWASP LLM 2025
    source: declared
  - namespace: jurisdiction
    value: cn
    label: China mainland
    source: declared
  safety_level: balanced
  output_delivery: full_buffered
parameters:
- name: on_unknown
  label: Uncertain result action
  kind: text
  required: false
  placeholder: block or allow
  description: block (default) blocks valid uncertain results; allow continues this
    Rule without skipping other Policies. Matches, errors and missing context keep
    their own handling.
  default: block
- name: review_unknown
  label: Review uncertain input results
  kind: text
  required: false
  placeholder: true or false
  description: When true, a valid JEV input gray-area result is reviewed by the separately
    validated classifier_review.input binding. Output, matches, errors and missing
    context keep their handling.
  default: 'false'
