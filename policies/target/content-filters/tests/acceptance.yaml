  - competitor/intent
  kind: scenario
  required: true
  parameter_names: []
  group: Ambiguous entity
  scope: policy
- id: competitor-mention-detection/competitor-comparison-input-filter/ambiguous-entity-002
  name: 'competitor-mention-detection: Allow ambiguous lounge question'
  description: A service-policy lookup must not be blocked solely because the entity
    is ambiguous.
  phase: input
  content: Qatar lounge access rules
  expected_decision: allow
  covered_rule_ids:
  - competitor/intent
  kind: scenario
  required: true
  parameter_names: []
  group: Ambiguous entity
  scope: policy
- id: competitor-mention-detection/competitor-comparison-input-filter/ambiguous-entity-003
  name: 'competitor-mention-detection: Allow ambiguous check-in question'
  description: Operational timing without comparison remains allowed.
  phase: input
  content: Qatar check in time
  expected_decision: allow
  covered_rule_ids:
  - competitor/intent
  kind: scenario
  required: true
  parameter_names: []
  group: Ambiguous entity
  scope: policy
- id: competitor-mention-detection/competitor-comparison-input-filter/ambiguous-entity-004
  name: 'competitor-mention-detection: Allow city lounge question'
  description: A city-specific facility query has no competitor ranking intent.
  phase: input
  content: Doha premium lounge access
  expected_decision: allow
  covered_rule_ids:
  - competitor/intent
  kind: scenario
  required: true
  parameter_names: []
  group: Ambiguous entity
  scope: policy
- id: competitor-mention-detection/competitor-comparison-input-filter/ambiguous-entity-005
  name: 'competitor-mention-detection: Allow ambiguous refund question'
  description: A refund-policy lookup is allowed when it does not compare providers.
  phase: input
  content: Qatar refund policy
  expected_decision: allow
  covered_rule_ids:
  - competitor/intent
  kind: scenario
  required: true
  parameter_names: []
  group: Ambiguous entity
  scope: policy
