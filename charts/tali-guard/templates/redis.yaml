{{- include "tali-guard.defaults" . -}}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tali-guard.redisName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tali-guard.redisName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tali-guard.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: tasklattice-guard
    spec:
      serviceAccountName: {{ include "tali-guard.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args: [redis-server, --save, "", --appendonly, "no"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: redis, containerPort: 6379, protocol: TCP }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
