{{- include "tali-guard.defaults" . -}}
{{- include "tali-guard.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tali-guard.controllerName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels: &selector
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        checksum/controller-config: {{ include "tali-guard.controllerConfig" . | sha256sum }}
      {{- with .Values.rolloutRevision }}
        tasklattice.io/rollout-revision: {{ . | quote }}
      {{- end }}
      labels:
        <<: *selector
        app.kubernetes.io/name: {{ include "tali-guard.name" . }}
        app.kubernetes.io/part-of: tasklattice-guard
    spec:
      serviceAccountName: {{ include "tali-guard.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ include "tali-guard.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: [node, /opt/tasklattice/guard-controller/scripts/runtime/wait-for-postgresql.mjs]
          env:
            - name: CONTROLLER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: controller
          image: {{ include "tali-guard.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: grpc, containerPort: 9090, protocol: TCP }
          env:
            {{- $config := include "tali-guard.controllerConfig" . | fromYaml }}
            {{- range $key, $_ := $config.data }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef: { name: {{ $config.metadata.name }}, key: {{ $key }} }
            {{- end }}
            - name: CONTROLLER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.databaseSecretName" . }}, key: {{ .Values.database.secretKey }} } }
            - name: CONTROLLER_RUNNER_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.controlSecretName" . }}, key: {{ .Values.security.controlSecret.runnerTokenKey }} } }
            - name: CONTROLLER_METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.metricsSecretName" . }}, key: {{ .Values.security.metrics.tokenKey }} } }
            - name: BETTER_AUTH_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.controlSecretName" . }}, key: {{ .Values.security.controlSecret.betterAuthSecretKey }} } }
            - name: MODEL_GUARDRAILS_RUNTIME_LOG_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.runtimeLogSecretName" . }}, key: {{ .Values.security.runtimeLogs.encryptionKeyKey }} } }
            - name: CONTROLLER_BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.bootstrapAdminSecretName" . }}, key: {{ .Values.security.bootstrapAdmin.emailKey }} } }
            {{- if or .Values.security.bootstrapAdmin.existingSecret (not .Values.security.bootstrapAdmin.passwordHash) }}
            - name: CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.bootstrapAdminSecretName" . }}, key: {{ .Values.security.bootstrapAdmin.passwordKey }}, optional: true } }
            {{- end }}
            {{- if or .Values.security.bootstrapAdmin.existingSecret .Values.security.bootstrapAdmin.passwordHash }}
            - name: CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD_HASH
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.bootstrapAdminSecretName" . }}, key: {{ .Values.security.bootstrapAdmin.passwordHashKey }}, optional: true } }
            {{- end }}
            - name: CONTROLLER_BOOTSTRAP_ADMIN_NAME
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.bootstrapAdminSecretName" . }}, key: {{ .Values.security.bootstrapAdmin.nameKey }} } }
            - { name: CONTROLLER_ARTIFACT_SIGNING_KEY_PATH, value: /var/run/tasklattice/artifact/private-key.pem }
            {{- if .Values.security.controlTls.enabled }}
            - { name: CONTROLLER_GRPC_TLS_CERT_PATH, value: /var/run/tasklattice/control-tls/tls.crt }
            - { name: CONTROLLER_GRPC_TLS_KEY_PATH, value: /var/run/tasklattice/control-tls/tls.key }
            - { name: CONTROLLER_GRPC_TLS_CLIENT_CA_PATH, value: /var/run/tasklattice/control-tls/ca.crt }
            {{- end }}
            - { name: CONTROLLER_PROTO_PATH, value: /opt/tasklattice/guard-controller/proto/tasklattice/guard/control/v1/runner_control.proto }
            - { name: CONTROLLER_UI_DIST, value: /opt/tasklattice/guard-controller/dist }
          volumeMounts:
            - { name: artifact-signing, mountPath: /var/run/tasklattice/artifact, readOnly: true }
            {{- if .Values.security.controlTls.enabled }}
            - { name: control-tls, mountPath: /var/run/tasklattice/control-tls, readOnly: true }
            {{- end }}
            {{- if .Values.security.customCa.existingSecret }}
            - { name: custom-ca, mountPath: /etc/ssl/certs/tasklattice-custom-ca.crt, subPath: tasklattice-custom-ca.crt, readOnly: true }
            {{- end }}
            - { name: tmp, mountPath: /tmp }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: artifact-signing
          secret:
            secretName: {{ include "tali-guard.artifactSigningSecretName" . }}
            items:
              - { key: {{ .Values.security.artifactSigning.privateKeyKey }}, path: private-key.pem }
        {{- if .Values.security.controlTls.enabled }}
        - name: control-tls
          secret:
            secretName: {{ include "tali-guard.controlTlsSecretName" . }}
            items:
              - { key: {{ .Values.security.controlTls.caKey }}, path: ca.crt }
              - { key: {{ .Values.security.controlTls.controllerCertificateKey }}, path: tls.crt }
              - { key: {{ .Values.security.controlTls.controllerPrivateKeyKey }}, path: tls.key }
        {{- end }}
        {{- if .Values.security.customCa.existingSecret }}
        - name: custom-ca
          secret:
            secretName: {{ include "tali-guard.customCaSecretName" . }}
            items:
              - { key: {{ .Values.security.customCa.certificateKey }}, path: tasklattice-custom-ca.crt }
        {{- end }}
        - name: tmp
          emptyDir: {}
