{{- include "tali-guard.defaults" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tali-guard.fullname" . }}-test
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534 }
  containers:
    - name: health
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: true
      command: [/bin/sh, -ec]
      args:
        - |
          wget -qO- http://{{ include "tali-guard.controllerName" . }}:8080/health/ready | grep -q 'guard-controller'
          wget -qO- http://{{ include "tali-guard.runtimeName" . }}:8091/health/live | grep -q 'guard-runner'
