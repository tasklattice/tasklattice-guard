{{- include "tali-guard.defaults" . -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tali-guard.fullname" . }}-test
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "tali-guard.controllerImage" . | quote }}
      imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      command: [node, --input-type=module, -e]
      args:
        - |
          const checks = [
            [process.argv[1], "guard-controller", "ready"],
            [process.argv[2], "guard-runner", "ok"],
          ];
          try {
            for (const [url, component, status] of checks) {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
              if (!response.ok) throw new Error(`${component}: HTTP ${response.status} from ${url}`);
              const body = await response.json();
              if (body?.component !== component || body?.status !== status) {
                throw new Error(`${component}: unexpected health response from ${url}`);
              }
              console.log(`${component}: ${status}`);
            }
          } catch (error) {
            console.error(`Health check failed: ${error.message}`);
            process.exitCode = 1;
          }
        - http://{{ include "tali-guard.controllerName" . }}:8080/health/ready
        - http://{{ include "tali-guard.runtimeName" . }}:8091/health/live
