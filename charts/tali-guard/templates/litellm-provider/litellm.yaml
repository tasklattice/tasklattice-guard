{{- include "tali-guard.defaults" . -}}
{{- $provider := index .Values "litellm-provider" -}}
{{- if $provider.enabled }}
{{- $name := include "tali-guard.litellm.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
    app.kubernetes.io/group: litellm-provider
spec:
  replicas: {{ $provider.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tali-guard.litellm.selectorLabels" (dict "root" . "component" "litellm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali-guard.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm
        app.kubernetes.io/group: litellm-provider
      annotations:
        checksum/config: {{ include "tali-guard.litellm.litellmConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: "{{ $provider.image.repository }}:{{ $provider.image.tag }}"
          imagePullPolicy: {{ $provider.image.pullPolicy }}
          command: ["python", "-c"]
          args:
            - |
{{ .Files.Get "files/litellm/wait-postgresql.py" | indent 14 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.litellm.runtimeSecretName" . }}
                  key: database-url
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: litellm
          image: "{{ $provider.image.repository }}:{{ $provider.image.tag }}"
          imagePullPolicy: {{ $provider.image.pullPolicy }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1", "--use_v2_migration_resolver"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MIGRATION_DIR
              value: /tmp/litellm-migrations
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: DOCS_URL
              value: /docs
            - name: ROOT_REDIRECT_URL
              value: /ui
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.litellm.runtimeSecretName" . }}
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.litellm.runtimeSecretName" . }}
                  key: database-url
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.litellm.runtimeSecretName" . }}
                  key: ui-username
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.litellm.runtimeSecretName" . }}
                  key: salt-key
            # Guard Endpoint wiring is written by scripts/litellm-dev-wire.mjs.
            - name: TASKLATTICE_GUARD_API_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $provider.guard.existingSecret }}
                  key: api-base
            - name: TASKLATTICE_GUARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $provider.guard.existingSecret }}
                  key: api-key
            {{- if include "tali-guard.litellm.upstreamConfigured" . }}
            - name: LITELLM_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $provider.model.upstream.existingSecret }}
                  key: {{ $provider.model.upstream.apiKeyKey }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "tali-guard.litellm.runtimeSecretName" . }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml $provider.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
            items:
              - key: litellm-config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
    app.kubernetes.io/group: litellm-provider
spec:
  type: {{ $provider.service.type }}
  selector:
    {{- include "tali-guard.litellm.selectorLabels" (dict "root" . "component" "litellm") | nindent 4 }}
  ports:
    - name: http
      port: {{ $provider.service.port }}
      targetPort: http
{{- end }}
