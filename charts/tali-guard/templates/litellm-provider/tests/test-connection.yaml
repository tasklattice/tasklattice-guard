{{- include "tali-guard.defaults" . -}}
{{- $provider := index .Values "litellm-provider" -}}
{{- if $provider.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tali-guard.litellm.fullname" . }}-test
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
    app.kubernetes.io/group: litellm-provider
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: "{{ $provider.image.repository }}:{{ $provider.image.tag }}"
      imagePullPolicy: {{ $provider.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - |
          import json, sys, urllib.request
          url = sys.argv[1]
          with urllib.request.urlopen(url, timeout=10) as response:
              assert response.status == 200, f"HTTP {response.status} from {url}"
              print("litellm:", json.loads(response.read() or b"{}"))
        - http://{{ include "tali-guard.litellm.fullname" . }}:{{ $provider.service.port }}/health/liveliness
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
{{- end }}
