{{- include "tali-guard.validateValues" . }}
{{- if and (not .Values.models.credentials.existingSecret) .Values.models.credentials.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.modelRuntimeSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.models.credentials.values }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
