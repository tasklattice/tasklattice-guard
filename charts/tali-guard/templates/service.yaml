{{- include "tali-guard.defaults" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tali-guard.controllerName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    tasklattice.io/metrics-target: "true"
spec:
  type: {{ .Values.controller.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9090, targetPort: grpc }
{{- if .Values.controller.service.public.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tali-guard.controllerName" . }}-public
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    tasklattice.io/exposure: public-http
spec:
  type: {{ .Values.controller.service.public.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
  ports:
    - { name: http, port: {{ .Values.controller.service.public.port }}, targetPort: http }
{{- end }}
{{- $root := . -}}
{{- $pools := concat (list (dict "name" "default")) .Values.runner.pools -}}
{{- range $pool := $pools }}
{{- $runnerName := ternary (include "tali-guard.defaultRunnerName" $root) (printf "%s-runner-%s" (include "tali-guard.fullname" $root) $pool.name | trunc 63 | trimSuffix "-") (eq $pool.name "default") -}}
{{- $headlessServiceName := printf "%s-headless" $runnerName | trunc 63 | trimSuffix "-" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $headlessServiceName }}
  labels:
    {{- include "tali-guard.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: {{ $pool.name | quote }}
    tasklattice.io/service-role: governing
    tasklattice.io/metrics-target: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: {{ $pool.name | quote }}
  ports:
    - { name: runtime, port: 8091, targetPort: runtime }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ if eq $pool.name "default" }}{{ include "tali-guard.runtimeName" $root }}{{ else }}{{ printf "%s-%s" (include "tali-guard.runtimeName" $root) $pool.name | trunc 63 | trimSuffix "-" }}{{ end }}
  labels:
    {{- include "tali-guard.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: {{ $pool.name | quote }}
spec:
  type: {{ $root.Values.runner.service.type }}
  sessionAffinity: None
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: {{ $pool.name | quote }}
  ports:
    - { name: runtime, port: 8091, targetPort: runtime }
{{- end }}
{{- if .Values.runner.service.public.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tali-guard.runtimeName" . }}-public
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: default
    tasklattice.io/exposure: public-runtime
spec:
  type: {{ .Values.runner.service.public.type }}
  sessionAffinity: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: default
  ports:
    - { name: runtime, port: {{ .Values.runner.service.public.port }}, targetPort: runtime }
{{- end }}
