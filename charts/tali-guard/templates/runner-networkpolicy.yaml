{{- include "tali-guard.defaults" . -}}
{{- include "tali-guard.validateValues" . -}}
{{- if .Values.networkPolicy.runnerIsolation.enabled -}}
{{- $isolation := .Values.networkPolicy.runnerIsolation -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-runner-%s" (include "tali-guard.fullname" .) "default" | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    tasklattice.io/runner-pool: "default"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runner
      tasklattice.io/runner-pool: "default"
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: controller
      ports:
        - { protocol: TCP, port: 8091 }
    {{- if $isolation.ingressPeers }}
    - from: {{- toYaml $isolation.ingressPeers | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8091 }
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: controller
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9090 }
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: redis
      ports:
        - { protocol: TCP, port: 6379 }
    {{- end }}
    {{- if $isolation.dnsPeers }}
    - to: {{- toYaml $isolation.dnsPeers | nindent 8 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- end }}
    {{- with get $isolation.poolEgress "default" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
