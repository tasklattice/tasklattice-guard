{{- include "tali-guard.defaults" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tali-guard.controllerName" $ }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range (include "tali-guard.ingressHosts" . | fromJsonArray) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tali-guard.controllerName" $ }}
                port: { name: http }
          - path: /backend/v1/scans
            pathType: Exact
            backend:
              service:
                name: {{ include "tali-guard.runtimeName" $ }}
                port: { name: runtime }
    {{- end }}
{{- end }}
