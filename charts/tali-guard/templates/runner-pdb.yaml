{{- include "tali-guard.defaults" . -}}
{{- $runnerName := include "tali-guard.defaultRunnerName" . -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-availability" $runnerName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: "default"
spec:
  minAvailable: {{ min 1 (int .Values.runner.default.replicaCount) }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runner
      tasklattice.io/runner-pool: "default"
