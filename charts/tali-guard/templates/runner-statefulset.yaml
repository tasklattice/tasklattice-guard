{{- include "tali-guard.defaults" . -}}
{{- include "tali-guard.validateValues" . -}}
{{- $runnerAuth := include "tali-guard.runnerAuthRefs" . | fromJson -}}
{{- if hasKey .Values.runner "scanTimeoutSeconds" -}}
{{- $scanTimeout := toString .Values.runner.scanTimeoutSeconds -}}
{{- if or (not (regexMatch "^[0-9]+$" $scanTimeout)) (lt (int $scanTimeout) 1) (gt (int $scanTimeout) 300) -}}
{{- fail "runner.scanTimeoutSeconds must be a whole number between 1 and 300" -}}
{{- end -}}
{{- end -}}
{{- $runnerName := include "tali-guard.defaultRunnerName" . -}}
{{- $headlessServiceName := printf "%s-headless" $runnerName -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $runnerName }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: runner
    tasklattice.io/runner-pool: "default"
spec:
  serviceName: {{ $headlessServiceName }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.runner.default.replicaCount }}
  minReadySeconds: 5
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runner
      tasklattice.io/runner-pool: "default"
  template:
    metadata:
      annotations:
      {{- with .Values.rolloutRevision }}
        tasklattice.io/rollout-revision: {{ . | quote }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "tali-guard.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: tasklattice-guard
        tasklattice.io/runner-pool: "default"
    spec:
      serviceAccountName: {{ include "tali-guard.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: "{{ .Values.runner.image.repository }}:{{ default .Chart.AppVersion .Values.runner.image.tag }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: runtime, containerPort: 8091, protocol: TCP }
          env:
            - { name: GUARD_URL, value: {{ printf "http://%s:%v" (include "tali-guard.controllerName" .) 8080 | quote }} }
            - { name: GUARD_RUNNER_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: GUARD_RUNNER_POOL_ID, value: "default" }
            - { name: GUARD_RUNNER_COMPILER_CAPABLE, value: "true" }
            - { name: GUARD_RUNNER_MAX_CONCURRENCY, value: {{ .Values.runner.default.maxConcurrency | quote }} }
            {{- if hasKey .Values.runner "scanTimeoutSeconds" }}
            - { name: GUARD_SCAN_TIMEOUT_SECONDS, value: {{ .Values.runner.scanTimeoutSeconds | quote }} }
            {{- end }}
            - { name: GUARD_CONTROLLER_TARGET, value: {{ printf "%s:%v" (include "tali-guard.controllerName" .) 9090 | quote }} }
            - { name: GUARD_CONTROLLER_TELEMETRY_ENDPOINT, value: {{ printf "http://%s:%v/api/internal/v1/runtime-events" (include "tali-guard.controllerName" .) 8080 | quote }} }
            {{- if or .Values.observability.performanceDebug.enabled .Values.observability.tracing.enabled }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ required "observability.tracing.otlpEndpoint is required when tracing or performanceDebug is enabled" .Values.observability.tracing.otlpEndpoint | quote }} }
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
            {{- if .Values.observability.performanceDebug.enabled }}
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "1" }
            {{- else }}
            - { name: OTEL_TRACES_SAMPLER_ARG, value: {{ .Values.observability.tracing.sampleRatio | quote }} }
            {{- end }}
            {{- end }}
            {{- if or .Values.observability.performanceDebug.enabled .Values.observability.profiling.enabled }}
            - { name: GUARD_PYROSCOPE_SERVER_ADDRESS, value: {{ required "observability.profiling.serverAddress is required when profiling or performanceDebug is enabled" .Values.observability.profiling.serverAddress | quote }} }
            - { name: GUARD_PYROSCOPE_SAMPLE_RATE, value: {{ .Values.observability.profiling.sampleRate | quote }} }
            {{- end }}
            - name: GUARD_RUNNER_CONTROL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $runnerAuth.control.runner.name | quote }}, key: {{ $runnerAuth.control.runner.key | quote }} } }
            - name: GUARD_CONTROLLER_HTTP_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $runnerAuth.http.runner.name | quote }}, key: {{ $runnerAuth.http.runner.key | quote }} } }
            - name: GUARD_METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.metricsSecretName" . }}, key: {{ .Values.security.metrics.tokenKey }} } }
            - name: MODEL_GUARDRAILS_RUNTIME_LOG_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "tali-guard.runtimeLogSecretName" . }}, key: {{ .Values.security.runtimeLogs.encryptionKeyKey }} } }
            - { name: GUARD_ARTIFACT_PUBLIC_KEY_PATH, value: /var/run/tasklattice/artifact/public-key.pem }
            {{- if .Values.security.controlTls.enabled }}
            - { name: GUARD_CONTROLLER_CA_PATH, value: /var/run/tasklattice/control-tls/ca.crt }
            - { name: GUARD_RUNNER_CLIENT_CERT_PATH, value: /var/run/tasklattice/control-tls/runner.crt }
            - { name: GUARD_RUNNER_CLIENT_KEY_PATH, value: /var/run/tasklattice/control-tls/runner.key }
            {{- end }}
            {{- with include "tali-guard.callContextRedisUrl" . }}
            - { name: GUARD_RUNNER_CALL_CONTEXT_REDIS_URL, value: {{ . | quote }} }
            {{- end }}
            - { name: GUARD_RUNNER_CALL_CONTEXT_TTL_SECONDS, value: {{ .Values.runner.callContext.ttlSeconds | quote }} }
            - { name: GUARD_RUNNER_CALL_CONTEXT_COMPRESS_PLANS, value: {{ .Values.runner.callContext.compressPlans | quote }} }
            - { name: GUARD_RUNNER_CALL_CONTEXT_CAPACITY_FALLBACK, value: {{ .Values.runner.callContext.capacityFallback | quote }} }
          volumeMounts:
            - { name: artifact-signing, mountPath: /var/run/tasklattice/artifact, readOnly: true }
            {{- if .Values.security.controlTls.enabled }}
            - { name: control-tls, mountPath: /var/run/tasklattice/control-tls, readOnly: true }
            {{- end }}
            {{- if .Values.security.customCa.existingSecret }}
            - { name: custom-ca, mountPath: /etc/ssl/certs/tasklattice-custom-ca.crt, subPath: tasklattice-custom-ca.crt, readOnly: true }
            {{- end }}
            - { name: state, mountPath: /var/lib/tasklattice/guard-runner }
            - { name: tmp, mountPath: /tmp }
          startupProbe: { httpGet: { path: /health/live, port: runtime }, periodSeconds: 2, timeoutSeconds: 10, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health/ready, port: runtime }, periodSeconds: 10, timeoutSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: runtime }, periodSeconds: 20, timeoutSeconds: 10 }
          lifecycle:
            preStop:
              exec:
                # Give Service endpoint propagation time before Uvicorn receives
                # SIGTERM and drains requests inside the remaining grace period.
                command: [/bin/sh, -c, "sleep 5"]
          resources: {{- toYaml .Values.runner.default.resources | nindent 12 }}
      volumes:
        - name: artifact-signing
          secret:
            secretName: {{ include "tali-guard.artifactSigningSecretName" . }}
            items:
              - { key: {{ .Values.security.artifactSigning.publicKeyKey }}, path: public-key.pem }
        {{- if .Values.security.controlTls.enabled }}
        - name: control-tls
          secret:
            secretName: {{ include "tali-guard.controlTlsSecretName" . }}
            items:
              - { key: {{ .Values.security.controlTls.caKey }}, path: ca.crt }
              - { key: {{ .Values.security.controlTls.runnerCertificateKey }}, path: runner.crt }
              - { key: {{ .Values.security.controlTls.runnerPrivateKeyKey }}, path: runner.key }
        {{- end }}
        {{- if .Values.security.customCa.existingSecret }}
        - name: custom-ca
          secret:
            secretName: {{ include "tali-guard.customCaSecretName" . }}
            items:
              - { key: {{ .Values.security.customCa.certificateKey }}, path: tasklattice-custom-ca.crt }
        {{- end }}
        - name: state
          emptyDir: { sizeLimit: {{ .Values.runner.state.sizeLimit }} }
        - name: tmp
          emptyDir: {}
