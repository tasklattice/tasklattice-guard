{{- include "tali-guard.defaults" . -}}
{{- if and (not .Values.security.bootstrap.enabled) (not .Values.security.controlSecret.existingSecret) }}
{{- $name := include "tali-guard.controlSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.controlSecret.runnerTokenKey }}: {{ if $existing }}{{ index $existing.data .Values.security.controlSecret.runnerTokenKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.security.controlSecret.betterAuthSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.security.controlSecret.betterAuthSecretKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{ end }}

{{- if and (not .Values.security.bootstrap.enabled) (not .Values.security.metrics.existingSecret) }}
{{- $name := include "tali-guard.metricsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.metrics.tokenKey }}: {{ if $existing }}{{ index $existing.data .Values.security.metrics.tokenKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{ end }}

{{- if and (not .Values.security.bootstrap.enabled) (not .Values.security.runtimeLogs.existingSecret) }}
{{- $name := include "tali-guard.runtimeLogSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.runtimeLogs.encryptionKeyKey }}: {{ if $existing }}{{ index $existing.data .Values.security.runtimeLogs.encryptionKeyKey }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
{{ end }}

{{- if .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.databaseSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end }}

{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.postgresqlName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  {{ .Values.postgresql.auth.passwordKey }}: {{ .Values.postgresql.auth.password | quote }}
  {{ .Values.database.secretKey }}: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "tali-guard.postgresqlName" .) 5432 .Values.postgresql.auth.database | quote }}
{{- end }}

{{- if not .Values.security.bootstrapAdmin.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.bootstrapAdminSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.security.bootstrapAdmin.emailKey }}: {{ .Values.security.bootstrapAdmin.email | quote }}
  {{- if .Values.security.bootstrapAdmin.passwordHash }}
  {{ .Values.security.bootstrapAdmin.passwordHashKey }}: {{ .Values.security.bootstrapAdmin.passwordHash | quote }}
  {{- else }}
  {{ .Values.security.bootstrapAdmin.passwordKey }}: {{ .Values.security.bootstrapAdmin.password | quote }}
  {{- end }}
  {{ .Values.security.bootstrapAdmin.nameKey }}: {{ .Values.security.bootstrapAdmin.name | quote }}
{{- end }}

{{ $signingName := include "tali-guard.artifactSigningSecretName" . -}}
{{- $signingExisting := lookup "v1" "Secret" .Release.Namespace $signingName -}}
{{- $signingAnnotations := dict -}}
{{- if $signingExisting -}}
{{- $signingAnnotations = default (dict) $signingExisting.metadata.annotations -}}
{{- end -}}
{{/* Preserve a signing Secret owned by older chart releases during migration
     to existingSecret. Fresh externally managed Secrets are never rendered. */}}
{{- if and (or .Values.security.artifactSigning.existingSecret .Values.security.bootstrap.enabled) (eq (get $signingAnnotations "meta.helm.sh/release-name") .Release.Name) (eq (get $signingAnnotations "meta.helm.sh/release-namespace") .Release.Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $signingName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.artifactSigning.privateKeyKey }}: {{ required "existing signing Secret is missing its private key" (index $signingExisting.data .Values.security.artifactSigning.privateKeyKey) | quote }}
  {{ .Values.security.artifactSigning.publicKeyKey }}: {{ required "existing signing Secret is missing its public key" (index $signingExisting.data .Values.security.artifactSigning.publicKeyKey) | quote }}
{{ else if and (not .Values.security.bootstrap.enabled) (not .Values.security.artifactSigning.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.artifactSigningSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.security.artifactSigning.privateKeyKey }}: |
    {{- .Values.security.artifactSigning.privateKey | nindent 4 }}
  {{ .Values.security.artifactSigning.publicKeyKey }}: |
    {{- .Values.security.artifactSigning.publicKey | nindent 4 }}
{{ end }}

{{- if .Values.security.bootstrap.enabled }}
{{- range $spec := (include "tali-guard.bootstrapSecretSpecs" . | fromJsonArray) }}
{{- if and (ne $spec.kind "ed25519") (ne $spec.kind "mtls") }}
{{ include "tali-guard.retainedBootstrapSecret" (dict "root" $ "name" $spec.name) }}
{{- end }}
{{- end }}
{{- end }}
