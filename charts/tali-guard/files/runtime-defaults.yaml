# Automatically loaded by templates. Advanced values override these defaults.
rolloutRevision: ''
controller:
  # Controller UI/auth URL settings when publicUrl is empty.
  publicUrl:
    - https://guard.example.com
  auth:
    minLoginLength: 8
  # Sign-in throttling keys on the client address. Leave empty when browsers and
  # CLI clients connect directly; the Controller then uses the socket peer and
  # ignores any supplied X-Forwarded-For. Behind an ingress/gateway, list its
  # pod CIDRs so the real client address is trusted instead of the proxy's.
  trustedProxyCidrs: []
  service:
    type: ClusterIP
    public:
      enabled: false
      type: LoadBalancer
      port: 38081
runner:
  # Test execution and provider-recovery budgets.
  validation:
    # Cases executed in parallel. Lower this for providers with small quotas;
    # explicit 429 responses then recover through providerRateLimitAttempts.
    maxConcurrency: 8
    providerRateLimitAttempts: 3
  # Jev reports "uncertain" for probabilities strictly between these bounds; a
  # blocking Policy then fails closed. Narrow the band to reduce uncertainty.
  jev:
    lowerThreshold: 0.1
    upperThreshold: 0.9
  laya:
    lowerThreshold: 0.1
    upperThreshold: 0.9
  service:
    type: ClusterIP
    public:
      enabled: false
      type: LoadBalancer
      port: 38082
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
observability:
  slo:
    availabilityTarget: 0.999
    runtimeP95Seconds: 2.5
    runtimeP99Seconds: 5.0
    completeCoverageTarget: 1.0
    burnRateFast: 14.4
    burnRateSlow: 6
    heartbeatMaxAgeSeconds: 30
    telemetryMaxAgeSeconds: 60
    pipelineMaxAgeSeconds: 60
  tracing:
    sampleRatio: 0.1
  profiling:
    sampleRate: 100
  serviceMonitor:
    interval: 15s
    scrapeTimeout: 10s
