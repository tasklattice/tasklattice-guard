# Production of the local Guardrail promotion pair. Layer on values-dev.yaml:
#   npm run helm:deploy:promotion
# Same features as UAT. By procedure (SOP), Guardrails reach production as
# imported release packages; creating one here is still possible.
#
# Trusted package sources (controller.promotion.trust.sources) carry the UAT
# public keys. The deploy command generates them into
# .local-secrets/promotion/prod-trust.values.yaml and layers that file last.

fullnameOverride: tali-guard-prod

controller:
  publicUrl:
    - http://127.0.0.1:38281
  service:
    public:
      port: 38281

runner:
  service:
    public:
      port: 38282
