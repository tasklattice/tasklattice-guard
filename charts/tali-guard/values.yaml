# Deployment defaults and common configuration reference; optional examples are commented.
# For advanced Secret key-name overrides, see files/security-defaults.yaml and
# ../../docs/operations.md#bootstrap-account-operations.
# Copy only the settings you need into a private environment values file.
# Before deploying: configure PostgreSQL, Redis (for multiple Runners), the initial
# administrator and publicUrl. Empty credentials below are not usable defaults.
# Local development/testing needs only values-dev-uat.yaml:
#   npm run helm:deploy:dev
# No separate PROD, advanced or debug values file is needed. All environments
# support the same Guardrail import/export workflow without package key settings.
# Adapter/Scan behavior and models are configured by the application, not Helm.
#
# UI + runtime on one external hostname/port (existing Istio Gateway):
#   publicUrl: https://guard-uat.example.com:8443
#   ingress.enabled: false
#   controller.service.public.enabled: false
#   runner.service.public.enabled: false
# See examples/virtualservice-shared-host.yaml for ordered path routing.
# Internal requests still use Services; do not configure internal URLs or ports.

# Optional resource naming; preserve existing names when upgrading a release.
nameOverride: ""
fullnameOverride: ""
# Registry Secret names, e.g. [{ name: registry-credentials }].
imagePullSecrets: []
# Moving-image rollout trigger; npm dev deploy sets this automatically.
# rolloutRevision: "2026-10-13-1"

# Shared external origin for UI, Endpoint addresses and Better Auth trusted origin.
# Set once, e.g. https://guard-uat.example.com:8443 (scheme + hostname + port).
# No path, credentials, query or fragment; an optional trailing slash is accepted.
# Host casing and default ports (HTTP 80 / HTTPS 443) normalize to browser Origin.
# Takes precedence over controller.publicUrl, including local dev URLs.
# Ingress hosts are derived from it; VirtualService still needs matching routes.
# Maps to CONTROLLER_PUBLIC_URL and, unless runner.publicUrl overrides it,
# CONTROLLER_RUNTIME_PUBLIC_URL in the Controller ConfigMap.
# Empty uses the Controller URL settings; without runner.publicUrl, Endpoint
# addresses derive from the incoming Controller request origin. Local HTTP
# loopback + Runtime LoadBalancer derives its separate public port instead.
# Internal requests always use Service DNS, independently of this setting.
publicUrl: ""

controller:
  # Optional complete provenance budget override (rows include retained history;
  # bytes are logical context payload, separate from PostgreSQL disk/RAM).
  # endpointContextStorage:
  #   maxRowsPerPool: 256
  #   maxRowsGlobal: 2048
  #   maxPayloadBytesPerContext: 65536
  #   maxPayloadBytesPerPool: 16777216
  #   maxPayloadBytesGlobal: 67108864
  databaseTimeouts:
    statementMs: 30000
    lockMs: 5000
    idleTransactionMs: 30000
  runnerSyncConcurrency: 4
  # Singleton UI/API service. Image tags default to Chart.appVersion.
  image:
    repository: ghcr.io/tasklattice/tali-guard-controller
    pullPolicy: IfNotPresent
    # tag: "0.2.0" # Omit to use Chart.appVersion; dev UAT uses locally built :dev.
  # Optional UI-only URLs, used only when top-level publicUrl is empty.
  # First is the auth base URL; all derive trusted origins and Ingress hosts.
  # publicUrl: [https://guard.example.com] # A single string is also supported.
  # Extra browser origins, e.g. a separate UI development server. Normally omit.
  # Shared publicUrl is always trusted; with no shared URL this replaces derived
  # origins for compatibility. Remove stale entries when switching environments.
  # trustedOrigins: [http://localhost:8092]
  # Optional login policy; applies to account setup and future changes.
  # Above 8 requires external Secrets for every enabled bootstrap account.
  # auth:
  #   minLoginLength: 8
  # Login throttling keys on the client address, not one shared bucket. Empty
  # uses the connection peer and ignores client-supplied X-Forwarded-For. Behind
  # an ingress/gateway, list its CIDRs, e.g. ["10.244.0.0/16"].
  # trustedProxyCidrs: []
  # Internal HTTP/gRPC ports are fixed at 8080/9090. For direct local exposure:
  # service:
  #   type: ClusterIP
  #   public:
  #     enabled: true
  #     type: LoadBalancer # Or NodePort; exposes HTTP only, never gRPC.
  #     port: 38081 # Service port; NodePort is allocated by Kubernetes.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

runner:
  # Optional different data-plane URL; normally inherits top-level publicUrl.
  # Overrides CONTROLLER_RUNTIME_PUBLIC_URL in the Controller ConfigMap.
  # When neither URL is configured, Endpoint addresses use the incoming Controller origin.
  # Never append /runtime/v1/endpoints/<uuid>; internal calls always use Service DNS.
  # publicUrl: https://runtime.example.com:8443
  # Shared image for all data-plane pools. Tags default to Chart.appVersion.
  image:
    repository: ghcr.io/tasklattice/tali-guard-runner
    pullPolicy: IfNotPresent
    # tag: "0.2.0"
  # Runtime Service port is fixed at 8091. For direct local exposure:
  # service:
  #   type: ClusterIP
  #   public:
  #     enabled: true
  #     type: LoadBalancer
  #     port: 38082 # Service port; NodePort is allocated by Kubernetes.
  default:
    # Two replicas provide rolling-update availability; shared Redis is required.
    replicaCount: 2
    maxConcurrency: 64
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi
  # Extra StatefulSets: name, replicaCount, maxConcurrency and resources per pool.
  pools: []
  # Example pool entry (replace [] above; do not add a second pools key):
  # - name: batch
  #   replicaCount: 2
  #   maxConcurrency: 32
  #   resources:
  #     requests: { cpu: 500m, memory: 1Gi }
  #     limits: { memory: 4Gi }
  # Managed Redis URL; required for multi-replica pools unless redis.enabled=true.
  # Optional admission objects belong on default or each pools[] entry, with no
  # inheritance. Omit them to leave admission off. Exact Runner JSON field names:
  # tenantAdmission:
  #   capacity: 4
  #   tenant_limits: { tenantA: 2, tenantB: 2 }
  #   max_queued: 8
  #   max_queued_per_tenant: 4
  #   queue_timeout_seconds: 0.25
  # distributedRateAdmission: # additionally needs pool auth and external Redis
  #   pool_id: default # must match this entry's trusted pool name
  #   revision: v1
  #   window_ms: 1000
  #   pool_limit: 20
  #   tenant_limits: { tenantA: 12, tenantB: 12 }
  # groupRateAdmission: # alternative to distributedRateAdmission, across pools
  #   group_id: group-ab # exact Controller group ID
  #   revision: group-v1
  #   window_ms: 1000
  #   group_limit: 20
  #   tenant_limits: { tenantA: 12, tenantB: 12 }
  #   pool_limits: { default: 15, batch: 15 }
  #   pool_epochs: { default: 0, batch: 0 } # exact Controller allocation epochs
  # Every declared member pool needs the identical complete group policy plus
  # its own local tenantAdmission. Remote releases need coordinated validation.
  # Operator must provision the identical Redis policy separately; Helm never
  # creates/reset quotas. Bundled ephemeral Redis is rejected in distributed mode.
  # Cannot be combined with redis.enabled=true.
  callContextRedisUrl: ""
  # Test execution and provider recovery. Lower maxConcurrency for providers with
  # small quotas; explicit HTTP 429 responses are retried with bounded backoff.
  validation:
    maxConcurrency: 8
    providerRateLimitAttempts: 3
  # Jev reports "unknown" strictly between these probabilities. Each classifier
  # Rule's on_unknown determines its action; errors retain failure handling.
  # Thresholds affect all JEV checks on this Runner. Test changes on an isolated
  # Runner before adjusting a shared deployment.
  jev:
    lowerThreshold: 0.1
    upperThreshold: 0.9
  # Independent Laya operating point; JEV changes do not affect it.
  laya:
    lowerThreshold: 0.1
    upperThreshold: 0.9
  callContext:
    ttlSeconds: 300
    # Upgrade all readers before enabling compression on an older installation.
    compressPlans: true
    # Only Redis allocation failures degrade to checks of current content.
    capacityFallback: true
  # Example: redis://redis.uat.svc.cluster.local:6379/0
  # Use rediss:// and the required authentication for a managed TLS Redis.
  state:
    # Ephemeral artifact cache, rebuilt from Controller state after rescheduling.
    sizeLimit: 2Gi
  telemetryProgress:
    persistence:
      # Enable explicitly with security.poolAuthentication.telemetryProgress.
      # One retained PVC per StatefulSet replica; artifact cache stays ephemeral.
      enabled: false
      size: 64Mi
      # Empty selects the cluster's default StorageClass.
      storageClass: ""

database:
  # Choose an existing Secret or bundled PostgreSQL; these are mutually exclusive.
  # Secret must already exist in the release namespace, containing secretKey.
  existingSecret: ""
  secretKey: database-url

# Development-only PostgreSQL; production uses database.existingSecret.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: guard
    username: guard
  persistence:
    # false uses ephemeral storage; true requests a PVC from this StorageClass.
    enabled: true
    # Creation-time settings: changing size or StorageClass requires recreating
    # the StatefulSet. Existing PVCs must be resized separately when supported.
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Development-only Redis; production uses runner.callContextRedisUrl.
redis:
  enabled: false
  maxmemory: 4gb
  maxmemoryPolicy: noeviction
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 6Gi

security:
  # Internal signing keys, tokens and mTLS certificates initialize automatically.
  # No signing key is needed for ordinary Guardrail file import/export.
  # false selects token-authenticated plaintext gRPC instead of mTLS.
  controlTls:
    enabled: true
    # Optional external TLS Secret. Setting it disables automatic certificates.
    # Required keys: ca.crt, tls.crt, tls.key, runner.crt, runner.key.
    # existingSecret: guard-control-tls
  bootstrapAdmin:
    # Without existingSecret, every initialization Job run resets this account
    # to the image-provided login; Controller reapplies mounted credentials at
    # startup and after Secret revisions. Existing sessions are revoked.
    # existingSecret: guard-bootstrap-admin
    username: admin
    name: Administrator
  # The user account initializes by default; set enabled=false to omit it.
  # bootstrapUser:
  #   enabled: true
  #   existingSecret: guard-bootstrap-user
  # Optional private CA for outbound HTTPS model/provider connections:
  # customCa:
  #   existingSecret: company-model-ca
  #   certificateKey: ca.crt
  # Optional platform-managed internal credentials (otherwise auto-generated):
  # artifactSigning:
  #   existingSecret: guard-artifact-signing # private-key.pem, public-key.pem
  # controlSecret:
  #   existingSecret: guard-control # runner-token, better-auth-secret
  # poolAuthentication: # optional: references only; never put token values here
  #   enabled: true
  #   scopedTelemetry: false # opt-in quarantine/freshness limitations; see README
  #   telemetryProgress: false # opt-in authenticated WAL progress; requires PVCs below
  #   controllerSecret: guard-pool-token-map
  #   controllerKey: pool-tokens.json
  #   runnerSecrets:
  #     default: { name: guard-default-pool-token, key: token }
  #     batch: { name: guard-batch-pool-token, key: token } # when batch pool is configured
  # runnerHttpAuthentication: # optional separate Controller-to-Runner role; requires poolAuthentication
  #   enabled: true
  #   controllerSecret: guard-http-token-map
  #   controllerKey: pool-http-tokens.json
  #   runnerSecrets:
  #     default: { name: guard-default-http-token, key: token }
  #     batch: { name: guard-batch-http-token, key: token }
  # metrics:
  #   existingSecret: guard-metrics # metrics-token
  # runtimeLogs:
  #   existingSecret: guard-runtime-logs # encryption-key

serviceAccount:
  # To use an existing ServiceAccount: create=false and name=<existing name>.
  create: true
  annotations: {}
  name: ""

# Hardened Pod/container defaults; uncomment only to customize your platform.
# podSecurityContext:
#   runAsNonRoot: true
#   runAsUser: 65532
#   runAsGroup: 65532
#   fsGroup: 65532
#   seccompProfile: { type: RuntimeDefault }
# securityContext:
#   allowPrivilegeEscalation: false
#   capabilities: { drop: [ALL] }
#   readOnlyRootFilesystem: true

ingress:
  # Routes /runtime/v1/endpoints to Runtime and other paths to Controller UI/API.
  # Keep disabled when an external VirtualService provides ingress.
  enabled: false
  className: ""
  annotations: {}
  # Optional host override; otherwise hosts derive from publicUrl, falling back
  # to controller.publicUrl when the shared URL is empty.
  # host: guard.example.com
  tls: []
  # Example TLS entry: { secretName: guard-ingress-tls, hosts: [guard.example.com] }

# Requires Prometheus Operator CRDs and a Grafana dashboard sidecar by default.
observability:
  # Enables all telemetry with 100% traces; both backend addresses are required.
  # Does not enable Guardrail content logging. Local shortcut:
  #   npm run helm:deploy:dev:debug
  # For other environments set the switch and both backend URLs below.
  performanceDebug:
    enabled: false
  # OTLP HTTP collector/Tempo endpoint.
  tracing:
    enabled: false
    otlpEndpoint: ""
    # Example: http://tempo.monitoring.svc.cluster.local:4318
    # sampleRatio: 0.1 # Ignored by performanceDebug, which forces 1.0.
  # Pyroscope server address.
  profiling:
    enabled: false
    serverAddress: ""
    # Example: http://pyroscope.monitoring.svc.cluster.local:4040
    # sampleRate: 100
  serviceMonitor:
    # Disable this and prometheusRule if Prometheus Operator CRDs are absent.
    enabled: true
    # Extra metadata.labels shared by Controller and Runner ServiceMonitors.
    # Values must be strings; chart-generated label keys cannot be overridden.
    # These do not add labels to scraped metrics or change Service selectors.
    labels: {}
    # Example labels: { release: "monitoring", team: "platform" }.
    # Quote numeric/boolean-looking values, e.g. { build: "123", enabled: "true" }.
    # interval: 15s
    # scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    labels: {}
  grafanaDashboard:
    # Disable if no Grafana sidecar watches dashboard ConfigMaps.
    enabled: true
    labels:
      grafana_dashboard: "1"
    annotations: {}
  # Optional infrastructure SLO/alert thresholds (these are the defaults):
  # slo:
  #   availabilityTarget: 0.999
  #   runtimeP95Seconds: 2.5
  #   runtimeP99Seconds: 5.0
  #   completeCoverageTarget: 1.0
  #   burnRateFast: 14.4
  #   burnRateSlow: 6
  #   heartbeatMaxAgeSeconds: 30
  #   telemetryMaxAgeSeconds: 60
  #   pipelineMaxAgeSeconds: 60

networkPolicy:
  # Requires a NetworkPolicy-capable CNI. Limits Controller gRPC to this release's
  # Runners and bundled Redis ingress to Runners; HTTP routing remains available.
  enabled: true
  runnerIsolation:
    # Opt-in default-deny ingress/egress per Runner pool; needs an enforcing CNI.
    # Controller access, bundled Redis and DNS below are allowed explicitly.
    enabled: false
    # Additional trusted runtime gateways/scrapers (NetworkPolicyPeer objects).
    ingressPeers: []
    dnsPeers:
      - namespaceSelector:
          matchLabels: { kubernetes.io/metadata.name: kube-system }
        podSelector:
          matchLabels: { k8s-app: kube-dns }
    # Per-pool additional egress. External Redis, Providers and OTLP collectors
    # need explicit destinations/ports. Keys must name configured pools.
    poolEgress: {}
    # default:
    #   - to: [{ ipBlock: { cidr: 192.0.2.10/32 } }]
    #     ports: [{ protocol: TCP, port: 443 }]
