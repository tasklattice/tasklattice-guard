# Production defaults for Guard Controller and Guard Runner.
#
# Required production dependencies:
#   1. PostgreSQL 14+ through database.url or database.existingSecret.
#   2. A bootstrap administrator Secret, or inline bootstrap values supplied by
#      a secret values file.
#   3. An Ed25519 artifact-signing key pair.
#   4. A CA and mTLS certificates for the Controller/Runner control channel.
#   5. Redis because GuardRails 0 runs two replicas by default.
#
# For a self-contained local/OrbStack installation use values-dev.yaml.

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Changes to this value update the Controller and every Runner Pod template.
# It is used by the local Make target to roll moving :dev image tags.
rolloutRevision: ""

controller:
  # Controller owns UI, API, Better Auth, desired state and reconciliation.
  # The read-only Policy Catalog used by the restored product UI is bundled in
  # the Controller image; it does not add another runtime service or volume.
  # It is intentionally a singleton in this chart version.
  replicaCount: 1
  image:
    repository: ghcr.io/tasklattice/tali-guard-controller
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  publicUrl: https://guard.example.com
  trustedOrigins:
    - https://guard.example.com
  auth:
    # Production password policy. The local profile overrides this only for
    # the legacy admin/admin development account.
    minPasswordLength: 12
    # Allows exactly admin@tasklattice.local/admin only on a loopback public
    # URL. Keep false outside the self-contained local profile.
    allowLocalDefaultCredentials: false
  service:
    # Internal UI/API and Runner control-channel Service. Ingress targets this
    # Service; it stays private even when local public HTTP is enabled below.
    type: ClusterIP
    httpPort: 8080
    grpcPort: 9090
    public:
      # Optional HTTP-only Service for local clusters without Ingress.
      enabled: false
      type: LoadBalancer
      port: 38081
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Optional model used by Controller authoring tools and Playground. It handles
# intent/document analysis and supplies the model response between explicit
# input/output checks on GuardRails 0; it is never used for integration traffic.
controlPlaneAgent:
  provider:
    name: Qwen
    baseUrl: ""
    model: ""
    apiKey: ""
    existingSecret: ""
    secretKey: api-key

models:
  # Physical endpoints are reusable and contain no Guardrails capability logic.
  runtimes: []
  # Example:
  # - id: qwen3guard
  #   client: openai_chat
  #   base_url: http://qwen3guard.models.svc.cluster.local/v1
  #   model: Qwen/Qwen3Guard-Gen-8B
  #   api_key_env_var: QWEN_GUARD_API_KEY
  credentials:
    # Secret keys must match api_key_env_var values in models.runtimes.
    existingSecret: ""
    values: {}

evaluators:
  # Logical evaluator bindings map product contracts and parsing profiles onto
  # replaceable Model Runtimes. Multiple bindings may share one runtime.
  bindings: []
  # Example:
  # - id: qwen-content-safety
  #   contract_ref: tali.guard.content-safety.v1
  #   profile_ref: tali.qwen3guard.v1
  #   model_ref: qwen3guard
  #   priority: 10
  automatedReasoning:
    endpointUrl: ""
    apiKey: ""
    existingSecret: ""
    secretKey: api-key

runner:
  # All data-plane pools use this image. GuardRails 0 is the mandatory baseline
  # pool and is also the authoritative NeMo configuration compiler.
  # Integration setup instructions use a stable Runtime Service. They never
  # expose a Runner Pod name or identity to an upstream caller.
  image:
    repository: ghcr.io/tasklattice/tali-guard-runner
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  default:
    # Two stable ordinal Pods plus a minAvailable=1 PDB keep runtime traffic
    # available while StatefulSet replaces one Runner at a time.
    replicaCount: 2
    maxConcurrency: 64
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi
  # Additional pools are more Runner StatefulSets, not another application
  # component. StatefulSet ordinals keep Runner IDs and Pod names stable across
  # restarts. Each item requires name, replicaCount, maxConcurrency and resources.
  pools: []
  service:
    # Stable in-cluster data-plane endpoint. Kubernetes balances requests over
    # ready replicas; correctness never depends on client-IP/session affinity.
    type: ClusterIP
    port: 8091
    public:
      # Optional host-facing endpoint for local clusters. Production callers
      # should use the ClusterIP Service or a separately managed gateway.
      enabled: false
      type: LoadBalancer
      port: 38082
  # Production should set an externally managed Redis URL whenever any Runner
  # pool has more than one replica. The local profile instead enables the
  # development Redis dependency below.
  callContextRedisUrl: ""
  state:
    # Last-known-good compiled artifacts are kept in an ephemeral Pod volume.
    # The StatefulSet stabilizes Pod identity; this size-limited cache is still
    # rebuilt from Controller desired state after a Pod is rescheduled.
    sizeLimit: 2Gi

database:
  # Production should normally use existingSecret. The Secret key must contain
  # a PostgreSQL URL such as postgresql://guard:password@postgres:5432/guard.
  url: ""
  existingSecret: ""
  secretKey: database-url

# Development-only PostgreSQL dependency. Keep disabled in production and use
# an external HA PostgreSQL service through database.existingSecret instead.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: guard
    username: guard
    password: ""
    passwordKey: postgres-password
  service:
    port: 5432
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Development-only shared call-context dependency. Production keeps this
# disabled and supplies runner.callContextRedisUrl for a managed Redis service.
redis:
  enabled: false
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

security:
  # Optional CA used to verify HTTPS model Provider certificates. The same
  # externally managed Secret is mounted into the Linux certificate directory
  # of the Controller and every Runner. The Secret value must be PEM encoded.
  customCa:
    existingSecret: ""
    certificateKey: ca.crt
  metrics:
    # Helm creates and retains a dedicated scrape token by default. Prometheus
    # receives it through ServiceMonitor without reusing the control token.
    existingSecret: ""
    tokenKey: metrics-token
  bootstrapAdmin:
    # Prefer an existing Secret with email/password/name keys in production.
    # Inline values are supported for values-dev.yaml and private values files.
    existingSecret: ""
    email: ""
    password: ""
    name: Administrator
    emailKey: email
    passwordKey: password
    nameKey: name
  controlSecret:
    # When omitted, Helm creates and retains a random Runner token and Better
    # Auth secret. Set existingSecret when secrets are managed externally.
    existingSecret: ""
    runnerTokenKey: runner-token
    betterAuthSecretKey: better-auth-secret
  runtimeLogs:
    # Content captured by qualifying Runtime Logs is encrypted in Runner before
    # transport. Helm creates and retains a random key unless one is supplied.
    existingSecret: ""
    encryptionKeyKey: encryption-key
  artifactSigning:
    # The key pair must be Ed25519 PEM. Production should use existingSecret;
    # inline keys exist only to make the local profile self-contained.
    existingSecret: ""
    privateKey: ""
    publicKey: ""
    privateKeyKey: private-key.pem
    publicKeyKey: public-key.pem
  controlTls:
    # Production must provide an existing Secret. Development may set
    # autoGenerate=true; Helm then generates and retains a private CA plus
    # Controller server and Runner client certificates.
    existingSecret: ""
    autoGenerate: false
    caKey: ca.crt
    controllerCertificateKey: tls.crt
    controllerPrivateKeyKey: tls.key
    runnerCertificateKey: runner.crt
    runnerPrivateKeyKey: runner.key

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

ingress:
  # Ingress exposes only Controller UI/API. Runtime traffic enters through the
  # Runner pool Services and never traverses Controller.
  enabled: false
  className: ""
  annotations: {}
  host: guard.example.com
  tls: []

# Production observability defaults. The production installation contract
# includes Prometheus Operator CRDs and a Grafana dashboard sidecar. The
# low-overhead metrics, SLO rules, alerts, and dashboards stay enabled while
# full request tracing and continuous profiling remain opt-in.
observability:
  # On-demand, Runner data-plane performance troubleshooting preset. Enabling
  # this one switch forces tracing, continuous profiling, authenticated
  # ServiceMonitors, Prometheus rules, and both Grafana dashboards on. Traces
  # are sampled at 100% while the preset is active. Backend addresses still
  # come from tracing.otlpEndpoint and profiling.serverAddress so production
  # never silently sends diagnostics to an assumed destination.
  #
  # This preset does NOT enable GuardRail debug/trace content logging; runtime
  # evidence capture remains governed by each GuardRail logging setting.
  performanceDebug:
    enabled: false
  # Trace sampling keeps request -> Action -> model-call causality. The OTLP
  # endpoint should be an in-cluster collector or Tempo HTTP receiver.
  tracing:
    enabled: false
    otlpEndpoint: ""
    sampleRatio: 0.1
  # Continuous profiling is intentionally independent from trace sampling.
  # When both are enabled, sampled spans carry profile correlation labels.
  profiling:
    enabled: false
    serverAddress: ""
    sampleRate: 100
  # SLO and staleness budgets consumed by PrometheusRule. Tune these against
  # the latency and evidence-retention contract offered to upstream callers.
  slo:
    availabilityTarget: 0.999
    runtimeP90Seconds: 1.0
    runtimeP95Seconds: 2.5
    runtimeP99Seconds: 5.0
    completeCoverageTarget: 1.0
    burnRateFast: 14.4
    burnRateSlow: 6
    heartbeatMaxAgeSeconds: 30
    telemetryMaxAgeSeconds: 60
    pipelineMaxAgeSeconds: 60
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: true
    labels: {}
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
    annotations: {}

networkPolicy:
  enabled: true
