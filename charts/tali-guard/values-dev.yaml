# Self-contained local development profile (OrbStack, Docker Desktop, kind).
# Do not use these credentials or signing keys in a shared/production cluster.
#
# Build the two local images first:
#   make images
#
# Then upgrade (or install) everything required by the baseline deployment:
#   bash scripts/helm-upgrade.sh tali-guard ./charts/tali-guard orbstack tali \
#     --values ./charts/tali-guard/values-dev.yaml --wait --timeout 5m

fullnameOverride: tali-guard

controller:
  image:
    repository: ghcr.io/tasklattice/tali-guard-controller
    tag: dev
    # OrbStack shares locally built Docker images with Kubernetes.
    pullPolicy: Never
  publicUrl: http://localhost:38081
  trustedOrigins:
    - http://localhost:38081
  auth:
    # Preserve admin/admin without weakening normal Better Auth password rules.
    minPasswordLength: 12
    allowLocalDefaultCredentials: true
  # Keep the internal HTTP/gRPC Service private and publish only Controller
  # HTTP. This avoids exposing gRPC or colliding with tali-relay on 38080/9090.
  service:
    public:
      enabled: true
      type: LoadBalancer
      port: 38081

runner:
  image:
    repository: ghcr.io/tasklattice/tali-guard-runner
    tag: dev
    pullPolicy: Never
  default:
    replicaCount: 2
  service:
    public:
      enabled: true
      type: LoadBalancer
      # 38080 is tali-relay-control; 38081 is Guard Controller HTTP.
      port: 38082

# Local single-node PostgreSQL is infrastructure, not a third Guard application
# component. Production keeps this disabled and supplies database.existingSecret.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: guard
    username: guard
    password: guard-dev-postgres-password
  persistence:
    enabled: true
    size: 2Gi

# Two GuardRails 0 replicas must share input/output call-version context. This
# local Redis is infrastructure only; production uses runner.callContextRedisUrl.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent

security:
  bootstrapAdmin:
    # Better Auth hashes this password when it creates the development account.
    email: admin@tasklattice.local
    password: admin
    name: Local Administrator
  artifactSigning:
    # Fixed development-only Ed25519 pair so Controller and Runner share the
    # same trust root immediately after a Helm install.
    privateKey: |
      -----BEGIN PRIVATE KEY-----
      MC4CAQAwBQYDK2VwBCIEIAZDWsrK8/8d5HNbtnw1I5QIXxMtRbOv/THBKte8OeP4
      -----END PRIVATE KEY-----
    publicKey: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEAOw4OIsngbM/Uas1vfTJHFPUVV8MRVhWQePD2N6VG6CI=
      -----END PUBLIC KEY-----
  controlTls:
    # Helm generates a private CA and both certificates on first install, then
    # reuses the retained Secret on upgrades.
    autoGenerate: true

ingress:
  enabled: false

# Keep the self-contained development baseline independent from Prometheus
# Operator and Grafana. Apply values-debug.yaml when the local monitoring stack
# is installed and full performance diagnostics are wanted.
observability:
  performanceDebug:
    enabled: false
  tracing:
    enabled: false
  profiling:
    enabled: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafanaDashboard:
    enabled: false

networkPolicy:
  enabled: true
