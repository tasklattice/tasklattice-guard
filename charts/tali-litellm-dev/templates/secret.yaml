apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-litellm-dev.fullname" . }}
  labels:
    {{- include "tali-litellm-dev.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
type: Opaque
stringData:
  litellm-config.yaml: |
    {{- include "tali-litellm-dev.litellmConfig" . | nindent 4 }}
  database-url: {{ include "tali-litellm-dev.databaseUrl" . | quote }}
  master-key: {{ required "masterKey is required" .Values.masterKey | quote }}
  ui-username: {{ .Values.ui.username | quote }}
  ui-password: {{ .Values.ui.password | quote }}
  salt-key: {{ .Values.saltKey | quote }}
  {{- if include "tali-litellm-dev.upstreamConfigured" . }}
  upstream-api-key: {{ .Values.model.upstream.apiKey | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-litellm-dev.postgresqlName" . }}
  labels:
    {{- include "tali-litellm-dev.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  password: {{ .Values.postgresql.password | quote }}
