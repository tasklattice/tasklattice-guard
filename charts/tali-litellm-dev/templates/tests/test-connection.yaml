apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tali-litellm-dev.fullname" . }}-test
  labels:
    {{- include "tali-litellm-dev.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - |
          import json, sys, urllib.request
          url = sys.argv[1]
          with urllib.request.urlopen(url, timeout=10) as response:
              assert response.status == 200, f"HTTP {response.status} from {url}"
              print("litellm:", json.loads(response.read() or b"{}"))
        - http://{{ include "tali-litellm-dev.fullname" . }}:{{ .Values.service.port }}/health/liveliness
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
