syntax = "proto3";

package tasklattice.guard.control.v1;

import "artifact.proto";
import "endpoint.proto";
import "model.proto";
import "routing.proto";
import "validation.proto";

// RunnerControl is the only state-distribution channel between the control
// plane and data plane. Every business payload is a typed imported message;
// the stream envelope contains no embedded JSON documents.
service RunnerControl {
  rpc Connect(stream RunnerMessage) returns (stream ControllerMessage);
}

// Runner-to-Controller stream envelope. Registration must be the first body;
// every later body belongs to the registered runner and boot identity.
message RunnerMessage {
  reserved 20;
  reserved "candidate_compile_result";
  // Former compile_result: publication now reuses the validated candidate.
  reserved 13;
  reserved "compile_result";
  // Sender-generated correlation/deduplication identifier for this envelope.
  string message_id = 1;
  // UTC Unix epoch time in milliseconds when the envelope was created.
  int64 sent_at_unix_ms = 2;
  oneof body {
    RunnerRegistration registration = 10;
    RunnerHeartbeat heartbeat = 11;
    ArtifactResult artifact_result = 12;
    ValidationResult validation_result = 14;
    DesiredStateResult desired_state_result = 15;
    CapabilityValidationResult capability_validation_result = 16;
    ValidationProgress validation_progress = 17;
    ArtifactAdmissionResult artifact_admission_result = 18;
    GuardrailProtectionResult protection_result = 19;
    ServingLeaseRequest serving_lease_request = 21;
  }
}

// Controller-to-Runner stream envelope containing commands and desired state.
message ControllerMessage {
  reserved 18;
  reserved "candidate_compile_request";
  // Former compile_request: publication now reuses the validated candidate.
  reserved 12;
  reserved "compile_request";
  // Sender-generated correlation/deduplication identifier for this envelope.
  string message_id = 1;
  // UTC Unix epoch time in milliseconds when the envelope was created.
  int64 sent_at_unix_ms = 2;
  oneof body {
    RegistrationAccepted registration_accepted = 10;
    DesiredState desired_state = 11;
    DrainRequest drain_request = 13;
    ValidationRequest validation_request = 14;
    CapabilityValidationRequest capability_validation_request = 15;
    ArtifactAdmissionRequest artifact_admission_request = 16;
    GuardrailProtectionState protection_state = 17;
    ServingLeaseResponse serving_lease_response = 19;
  }
}

// Process identity and capabilities announced once when opening a stream.
message RunnerRegistration {
  // Stable logical instance identifier, normally derived from StatefulSet identity.
  string runner_id = 1;
  // Unique process-start identifier used to reject messages from an older boot.
  string boot_id = 2;
  // Logical Runner pool whose desired state this stream receives.
  string pool_id = 3;
  string runner_version = 4;
  // NeMo Guardrails runtime version loaded by this process.
  string nemo_version = 5;
  // Admission-slot capacity advertised by this Runner; must be greater than zero.
  int32 max_concurrency = 6;
  // True only when the Runner may compile and execute ValidationRequest candidates.
  bool compiler_capable = 7;
  map<string, string> labels = 8;
  // Last atomically activated desired-state generation, or zero before first sync.
  int64 applied_generation = 9;
  int64 applied_protection_generation = 10;
  // Stable disk WAL identity for the optional authenticated delivery protocol.
  optional string telemetry_wal_id = 11;
}

// Registration acknowledgement and heartbeat contract returned by Controller.
message RegistrationAccepted {
  // Current authoritative Controller generation for the registered pool.
  int64 desired_generation = 1;
  // Maximum interval in seconds between Runner heartbeats.
  int32 heartbeat_interval_seconds = 2;
  // Secret dispatched only to this current pool-authenticated control stream.
  TelemetryUploadAuthorization telemetry_upload_authorization = 3;
}

// Authenticates HTTP delivery from this registration, not physical workload
// attestation. Never project the capability into public APIs, logs or metrics.
message TelemetryUploadAuthorization {
  string wal_id = 1;
  string capability = 2;
  int64 acknowledged_cursor = 3;
  int64 produced_cursor = 4;
  string last_batch_id = 5;
  string last_batch_digest = 6;
}

// Monotonic liveness, convergence, and load observation for one Runner boot.
message RunnerHeartbeat {
  string runner_id = 1;
  string boot_id = 2;
  // Strictly increasing within one boot; stale or duplicate values are ignored.
  int64 sequence = 3;
  // Last atomically activated desired-state generation at observation time.
  int64 applied_generation = 4;
  RunnerLoad load = 5;
  int64 applied_protection_generation = 6;
  // Optional bounded process-local admission counters, not quota authority.
  bytes tenant_admission_snapshot_json = 7;
}

// Independent operating overlay: applying an emergency mode must not wait for
// model credentials, Artifact compilation or prewarming. Versions stay immutable.
message GuardrailProtectionState {
  // Monotonic Controller generation for this complete map, independent of Artifact application.
  int64 generation = 1;
  // Complete resource-level map. Missing entries use enforce.
  map<string, string> modes = 2;
}

// ACK/NACK for a persisted operating-mode snapshot on the registered Runner stream.
message GuardrailProtectionResult {
  string runner_id = 1;
  // Echo the exact dispatched protection generation; stale results never supersede newer ones.
  int64 generation = 2;
  // True only after the entire map has been validated, persisted and atomically applied.
  bool accepted = 3;
  // Diagnostic for a NACK; empty on ACK. Never include credentials or request content.
  string reason = 4;
}

// Delta counters and point-in-time pressure measurements for a fixed interval.
message RunnerLoad {
  // Aggregate requests currently holding admission slots across active
  // Guardrail runtimes. This is not the HTTP socket/in-flight count.
  int32 inflight = 1;
  // Admission-slot denominator used with inflight; must be greater than zero.
  int32 max_concurrency = 2;
  // Requests waiting for an admission slot at observation time.
  int32 queue_depth = 3;
  // Requests completed during observation_interval_ms; resets each interval.
  int64 requests_delta = 4;
  // Technical errors during observation_interval_ms; policy blocks are excluded.
  int64 errors_delta = 5;
  // Request timeouts during observation_interval_ms.
  int64 timeouts_delta = 6;
  // Request latency p95 in milliseconds for this observation interval.
  double latency_p95_ms = 7;
  // Process CPU utilization ratio in [0, 1].
  double cpu_utilization = 8;
  // Process memory utilization ratio in [0, 1].
  double memory_utilization = 9;
  int32 active_guardrails = 10;
  int32 compile_queue_depth = 11;
  // Exact duration in milliseconds covered by the delta counters.
  int64 observation_interval_ms = 12;
}

// Complete generation snapshot a Runner verifies, prewarms, and activates atomically.
message DesiredState {
  // Authoritative snapshot generation; activation is atomic across all fields.
  int64 generation = 1;
  // Complete artifact set required by this pool at generation.
  repeated Artifact artifacts = 2;
  repeated string disabled_guardrail_ids = 3;
  repeated string disabled_endpoint_ids = 4;
  // Field 5 carried the retired per-Endpoint RouterRoute list; Endpoints now
  // reach Guardrails only through their bound RouterRevision.
  reserved 5;
  reserved "routers";
  repeated EndpointRuntime endpoints = 6;
  map<string, string> guardrail_logging_levels = 7;
  DataPlaneModelConfiguration model_configuration = 8;
  repeated RouterRevision router_revisions = 9;
  // Optional per-dispatch challenge, understood only by capable Runners.
  // An ACK is evidence of this snapshot on this stream, not a serving lease.
  optional string snapshot_nonce = 10;
  // Epoch persisted with this exact dispatch. Required by experimental lease
  // consumers; never inferred from a Runner's cached state or defaulted to 0.
  optional int64 allocation_epoch = 11;
  // Controller-assigned group of this exact dispatched pool snapshot.
  optional string allocation_group_id = 12;
}

// ACK/NACK for the complete atomic desired-state generation. A NACK keeps the
// prior artifacts, Router revisions, endpoints, and model Provider registry active.
message DesiredStateResult {
  string runner_id = 1;
  // Complete desired-state generation that was either applied or rejected.
  int64 generation = 2;
  // True only after the full generation has been prewarmed and swapped in.
  bool accepted = 3;
  // Human-readable NACK detail; empty for an ACK.
  string reason = 4;
  string model_revision_id = 5;
  // Echo the Controller's optional challenge for this exact dispatched snapshot.
  optional string snapshot_nonce = 6;
}

// Optional experimental request. Its nonce must be unique within the boot and
// locally timed from before sending. This message does not enable serving.
message ServingLeaseRequest {
  string runner_id = 1;
  string boot_id = 2;
  string nonce = 3;
  int64 epoch = 4;
  int64 generation = 5;
  string snapshot_nonce = 6;
}

// An explicit rejection never authorizes serving. Even a grant is protocol
// groundwork until Runner enforcement and move coordination are integrated.
message ServingLeaseResponse {
  string nonce = 1;
  bool granted = 2;
  int64 epoch = 3;
  int64 generation = 4;
  string snapshot_nonce = 5;
  int32 duration_ms = 6;
}

// Runtime-only Endpoint projection; it contains no plaintext credential.
message EndpointRuntime {
  string endpoint_id = 1;
  // Adapter IDs are an extensible registry, not a closed enum.
  string adapter = 2;
  EndpointVerification verification = 3;
  // Explicit composed Router binding; empty rejects public traffic.
  string router_id = 4;
  // F5 Scan default when the request omits flagOnly. Absence preserves true.
  optional bool scan_flag_only_default = 5;
  // Controller-assigned owner; absent on legacy Controllers. Callers must
  // authenticate the Endpoint against the same snapshot before using it.
  optional string tenant_id = 6;
  // Opaque Controller-persisted allocation/snapshot provenance. Internal only;
  // public request headers and response assignments must never carry it.
  optional string telemetry_context_id = 7;
}

// ACK/NACK for verifying, prewarming, and activating an artifact generation.
// A NACK preserves the Runner's last-known-good active generation.
message ArtifactResult {
  string runner_id = 1;
  string artifact_id = 2;
  // Desired-state generation whose artifact was verified and staged.
  int64 generation = 3;
  // True only after verification and prewarming have completed successfully.
  bool accepted = 4;
  // Human-readable NACK detail; empty for an ACK.
  string reason = 5;
}

// Dry-run load check: verify a signed Artifact and build its runtime with the
// Runner's current software, Actions and model configuration, then discard it.
// Nothing is activated or served.
message ArtifactAdmissionRequest {
  // Correlation ID echoed by the result.
  string request_id = 1;
  Artifact artifact = 2;
}

// Outcome of an ArtifactAdmissionRequest on one Runner.
message ArtifactAdmissionResult {
  string runner_id = 1;
  // Must exactly match the originating ArtifactAdmissionRequest.request_id.
  string request_id = 2;
  // True only when verification and a full runtime build succeeded.
  bool admitted = 3;
  // Human-readable rejection detail; empty when admitted.
  string reason = 4;
  // NeMo Guardrails version the check ran against.
  string nemo_version = 5;
  // Applied model configuration revision; empty when none was configured.
  string model_revision_id = 6;
}

// Graceful shutdown command with an absolute admission deadline.
message DrainRequest {
  // Operator-visible explanation for the drain.
  string reason = 1;
  // UTC Unix epoch deadline in milliseconds after which new work must be rejected.
  int64 deadline_unix_ms = 2;
}
