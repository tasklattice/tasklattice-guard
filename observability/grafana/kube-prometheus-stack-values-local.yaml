# Local Grafana is an anonymous debugging surface. Editor access is intentional
# here because Grafana restricts Explore (used to expand Tempo traces) to
# Editors. Never carry this local-only role into an internet-facing router.
grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Editor
    auth:
      disable_login_form: true
  sidecar:
    datasources:
      exemplarTraceIdDestinations:
        datasourceUid: tasklattice-tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: Open trace
  additionalDataSources:
    - name: TaskLattice Tempo
      uid: tasklattice-tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      jsonData:
        httpMethod: GET
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: tasklattice-prometheus
        tracesToMetrics:
          datasourceUid: tasklattice-prometheus
          spanStartTimeShift: -2m
          spanEndTimeShift: 2m
          tags:
            - { key: guardrail.id, value: guardrail_id }
            - { key: endpoint.id, value: endpoint_id }
            - { key: runner.id, value: runner_id }
            - { key: gen_ai.provider.name, value: provider }
            - { key: gen_ai.request.model, value: model }
        tracesToProfiles:
          datasourceUid: tasklattice-pyroscope
          profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
          tags:
            - { key: service.name, value: service_name }
            - { key: runner.id, value: runner_id }
    - name: TaskLattice Pyroscope
      uid: tasklattice-pyroscope
      type: grafana-pyroscope-datasource
      access: proxy
      url: http://pyroscope:4040
      jsonData:
        minStep: 15s

prometheus:
  prometheusSpec:
    # Required for metric -> exact Tempo trace links from OpenMetrics exemplars.
    enableFeatures:
      - exemplar-storage
