[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tasklattice-guard-runner"
version = "0.2.0"
description = "TaskLattice Guard Python data plane powered by NeMo Guardrails."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "nemoguardrails[tracing]==0.24.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
  "grpcio>=1.74,<2",
  "grpcio-tools>=1.74,<2",
  "psutil>=7,<8",
  "redis>=6,<7",
  "prometheus-client>=0.21,<1",
  "prometheus-fastapi-instrumentator>=8,<9",
  "pyroscope-io>=1.2,<2",
  "pyroscope-otel>=1.1,<2",
]

[project.urls]
Repository = "https://github.com/tasklattice/tasklattice-guard"
Issues = "https://github.com/tasklattice/tasklattice-guard/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "control_plane: Controller features, plan construction, validation, and artifact production.",
  "data_plane: Runner-only runtime, model, routing, telemetry, and artifact-consumption behavior.",
  "e2e: Communication across the Controller/Runner protocol boundary.",
  "contract: Shared protocol, packaging, deployment, and generated-contract gates.",
]
