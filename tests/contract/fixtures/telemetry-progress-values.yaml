# Render-only rollout fixture. These Secret names are references, not credentials.
# Resource limits are assertions; this does not certify a 2Gi cluster.
postgresql:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
controller:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
runner:
  callContextRedisUrl: redis://existing-redis.example.test:6379/0
  default:
    replicaCount: 2
    maxConcurrency: 4
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }
security:
  bootstrapAdmin:
    email: admin@example.test
  poolAuthentication:
    enabled: true
    scopedTelemetry: true
    telemetryProgress: true
    controllerSecret: test-controller-pool-map
    controllerKey: tokens.json
    runnerSecrets:
      default: { name: test-default-pool-token, key: token }
